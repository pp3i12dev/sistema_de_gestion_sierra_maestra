<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear una cuenta - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Todos tus estilos existentes se mantienen igual */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f1cf10cc 0%, #ddb70d 50%, #ecaf08 100%);
            min-height: 100vh;
        }
        
        /* ... (todos tus estilos CSS existentes) ... */

        /* Nuevos estilos para el selector de tipo */
        .tipo-cliente-group {
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .tipo-cliente-label {
            color: #8B4513;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
            font-size: 1.1rem;
        }
        
        .tipo-cliente-options {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        
        .tipo-option {
            padding: 1rem 2rem;
            border: 2px solid #DAA520;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #8B4513;
        }
        
        .tipo-option:hover {
            background: #FFF8DC;
            transform: translateY(-2px);
        }
        
        .tipo-option.active {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            border-color: #FFD700;
            color: #583207;
            box-shadow: 0 5px 15px rgba(218, 165, 32, 0.3);
        }

        /* Clase para ocultar campos */
        .hidden-field {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Header (se mantiene igual) -->
    <header class="header">
        <a th:href="@{/inicio}" class="logo" style="text-decoration: none; cursor: pointer;">
            <div class="logo-circle">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">   
            </div>
            <div class="logo-text">Sierra Maestra</div>
        </a>
        <p class="subtitle">Para todos la luz, para todos todo</p>
        
        <nav class="nav-menu">
            <a href="#cervezas" class="nav-item">Nuestras Cervezas</a>
            <a href="#promos" class="nav-item">Promos</a>
            <a href="#quienes-somos" class="nav-item">¿Quiénes somos?</a>
            <a th:href="@{/inicio}" class=" nav-item active" id="btn-iniciar-sesion">Iniciar sesión</a>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Burbujas de cerveza -->
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        
        <div class="form-container">
            <h1>Crear Cuenta</h1>

            <!-- Success Message -->
            <div id="success-message" class="success-message">
                ¡REGISTRADO CON ÉXITO!
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message">
                <!-- Error messages will be inserted here -->
            </div>

            <!-- Registration Form -->
            <form id="formulario-registro" novalidate>
                <!-- Selector de Tipo de Cliente -->
                <div class="tipo-cliente-group">
                    <label class="tipo-cliente-label">Tipo de Cliente</label>
                    <div class="tipo-cliente-options">
                        <div class="tipo-option active" data-tipo="cliente">Cliente Personal</div>
                        <div class="tipo-option" data-tipo="empresa">Empresa</div>
                    </div>
                    <input type="hidden" id="tipo" name="tipo" value="cliente">
                </div>

                <div class="form-row">
                    <!-- Left Column -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required
                                   placeholder="Ingrese su nombre">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group" id="dni-group">
                            <label for="documento" class="form-label">DNI</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="documento" 
                                   name="documento" 
                                   required
                                   placeholder="Ej: 12345678" 
                                   maxlength="8"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <div class="invalid-feedback">El DNI debe contener 8 dígitos numéricos</div>
                        </div>

                        <div class="form-group">
                            <label for="mail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="mail" name="mail" required
                                   placeholder="ejemplo@email.com">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group" id="fecha-nacimiento-group">
                            <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    
                    <!-- Right Column -->
                    <div class="form-column">
                        <div class="form-group" id="apellido-group">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" required
                                   placeholder="Ingrese su apellido">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" required
                                   placeholder="Calle, número, ciudad">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" required
                                   placeholder="Ej: 1123456789" maxlength="15">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="cuit" class="form-label">Cuit</label>
                            <input type="text" class="form-control" id="cuit" name="cuit"
                                   placeholder="Ej: 20-12345678-9">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <!-- Password Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="contrasenia" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasenia" name="contrasenia" required
                               placeholder="Mínimo 6 caracteres" minlength="6">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmar_contrasenia" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="confirmar_contrasenia" required
                               placeholder="Repita su contraseña">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-register" id="btn-registrar">
                    Registrarte
                </button>
                
                <!-- Back Button -->
                <button type="button" class="btn-register" onclick="window.location.href='http://localhost:8080/'">   
                    <i class="bi bi-arrow-left"></i>
                    Volver
                </button>
            </form>
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formulario = document.getElementById('formulario-registro');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            const btnRegistrar = document.getElementById('btn-registrar');
            const tipoOptions = document.querySelectorAll('.tipo-option');
            const tipoHidden = document.getElementById('tipo');
            const dniGroup = document.getElementById('dni-group');
            const apellidoGroup = document.getElementById('apellido-group');
            const fechaNacimientoGroup = document.getElementById('fecha-nacimiento-group');
            const documentoInput = document.getElementById('documento');
            const apellidoInput = document.getElementById('apellido');
            const fechaNacimientoInput = document.getElementById('fecha_nacimiento');

            // URL base de la API
            const API_BASE_URL = 'http://localhost:8080';
            const API_ENDPOINT = '/addCliente';

            // Manejar selección de tipo de cliente
            tipoOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remover clase active de todos
                    tipoOptions.forEach(opt => opt.classList.remove('active'));
                    // Agregar clase active al seleccionado
                    this.classList.add('active');
                    // Actualizar valor del hidden
                    const tipo = this.getAttribute('data-tipo');
                    tipoHidden.value = tipo;
                    
                    // Mostrar/ocultar campos según el tipo
                    if (tipo === 'empresa') {
                        dniGroup.classList.add('hidden-field');
                        apellidoGroup.classList.add('hidden-field');
                        fechaNacimientoGroup.classList.add('hidden-field');
                        // Remover requeridos para estos campos
                        documentoInput.removeAttribute('required');
                        apellidoInput.removeAttribute('required');
                        fechaNacimientoInput.removeAttribute('required');
                    } else {
                        dniGroup.classList.remove('hidden-field');
                        apellidoGroup.classList.remove('hidden-field');
                        fechaNacimientoGroup.classList.remove('hidden-field');
                        // Restaurar requeridos
                        documentoInput.setAttribute('required', 'required');
                        apellidoInput.setAttribute('required', 'required');
                        fechaNacimientoInput.setAttribute('required', 'required');
                    }
                });
            });

            // Función para formatear fecha de yyyy-mm-dd a dd/mm/aaaa
            function formatearFecha(fechaISO) {
                if (!fechaISO) return '';
                const fecha = new Date(fechaISO);
                const dia = fecha.getDate().toString().padStart(2, '0');
                const mes = (fecha.getMonth() + 1).toString().padStart(2, '0');
                const año = fecha.getFullYear();
                return `${dia}/${mes}/${año}`;
            }

            function mostrarMensaje(mensaje, tipo) {
                if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    successMessage.textContent = mensaje;
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            function validarFormulario() {
                const contrasenia = document.getElementById('contrasenia').value;
                const confirmarContrasenia = document.getElementById('confirmar_contrasenia').value;
                const tipo = tipoHidden.value;
                
                // Validar DNI solo para cliente personal
                if (tipo === 'cliente') {
                    const dni = document.getElementById('documento').value;
                    if (!/^\d{8}$/.test(dni)) {
                        document.getElementById('documento').setCustomValidity('El DNI debe contener exactamente 8 dígitos numéricos');
                        document.getElementById('documento').classList.add('is-invalid');
                        return false;
                    } else {
                        document.getElementById('documento').setCustomValidity('');
                    }
                }

                // Validar que las contraseñas coincidan
                if (contrasenia !== confirmarContrasenia) {
                    document.getElementById('confirmar_contrasenia').setCustomValidity('Las contraseñas no coinciden');
                    return false;
                } else {
                    document.getElementById('confirmar_contrasenia').setCustomValidity('');
                }

                // Validar campos requeridos según el tipo
                let camposRequeridos = [
                    'nombre', 'mail', 'direccion', 'telefono', 
                    'contrasenia', 'confirmar_contrasenia'
                ];

                // Para cliente personal, agregar DNI, apellido y fecha_nacimiento
                if (tipo === 'cliente') {
                    camposRequeridos.push('documento', 'apellido', 'fecha_nacimiento');
                }

                let esValido = true;
                camposRequeridos.forEach(campo => {
                    const elemento = document.getElementById(campo);
                    if (!elemento.checkValidity()) {
                        elemento.classList.add('is-invalid');
                        esValido = false;
                    } else {
                        elemento.classList.remove('is-invalid');
                        elemento.classList.add('is-valid');
                    }
                });

                return esValido;
            }

            // Event listener para el formulario
            formulario.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!validarFormulario()) {
                    mostrarMensaje('Por favor corrija los errores en el formulario', 'error');
                    return;
                }

                btnRegistrar.disabled = true;
                btnRegistrar.textContent = 'Registrando...';

                try {
                    const formData = new FormData(formulario);
                    const tipo = tipoHidden.value;
                    
                    // Preparar datos según el tipo
                    let documentoValor = '';
                    let apellidoValor = '';
                    let fechaNacimientoValor = '';

                    if (tipo === 'empresa') {
                        // Para empresa: valores fijos
                        documentoValor = '99999999';
                        apellidoValor = 'Empresa';
                        fechaNacimientoValor = ''; // Nada como pediste
                    } else {
                        // Para cliente personal: valores normales del formulario
                        documentoValor = formData.get('documento');
                        apellidoValor = formData.get('apellido').trim();
                        fechaNacimientoValor = formatearFecha(formData.get('fecha_nacimiento'));
                    }

                    // Crear objeto con la estructura exacta que espera la entidad Cliente
                    const clienteData = {
                        activo: true,
                        apellido: apellidoValor,
                        contrasenia: formData.get('contrasenia'),
                        cuit: formData.get('cuit') ? formData.get('cuit').trim() : null,
                        direccion: formData.get('direccion').trim(),
                        documento: documentoValor,
                        fecha_nacimiento: fechaNacimientoValor,
                        legajo: "",
                        mail: formData.get('mail').trim(),
                        nombre: formData.get('nombre').trim(),
                        telefono: formData.get('telefono').trim(),
                        tipo: tipo
                    };

                    console.log('Enviando datos:', clienteData);
                    console.log('Endpoint:', API_BASE_URL + API_ENDPOINT);

                    // Enviar petición al endpoint
                    const response = await fetch(API_BASE_URL + API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(clienteData)
                    });

                    const resultado = await response.json();
                    console.log('Respuesta del servidor:', resultado);

                    if (response.ok) {
                        mostrarMensaje('¡REGISTRADO CON ÉXITO!', 'success');
                        formulario.reset();
                        
                        // Restaurar estado inicial a Cliente Personal
                        tipoOptions[0].click();
                        
                        // Redirigir al home después de 3 segundos
                        setTimeout(() => {
                            window.location.href = '/inicio';
                        }, 3000);
                    } else {
                        // Mostrar error específico del servidor
                        if (resultado.descripcion) {
                            mostrarMensaje(resultado.descripcion, 'error');
                        } else if (resultado.data) {
                            mostrarMensaje(resultado.data, 'error');
                        } else {
                            mostrarMensaje('Error al crear la cuenta. Intente nuevamente.', 'error');
                        }
                    }

                } catch (error) {
                    console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Verifique su internet e intente nuevamente.', 'error');
                } finally {
                    btnRegistrar.disabled = false;
                    btnRegistrar.textContent = 'Registrarte';
                }
            });

            // Validación en tiempo real para DNI (solo para cliente personal)
            document.getElementById('documento').addEventListener('input', function() {
                if (tipoHidden.value === 'cliente') {
                    const dni = this.value;
                    if (/^\d{8}$/.test(dni)) {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                        this.setCustomValidity('');
                    } else {
                        this.classList.remove('is-valid');
                        if (dni.length > 0) {
                            this.classList.add('is-invalid');
                        }
                    }
                }
            });

            // Validaciones en tiempo real para el resto de campos
            const camposValidacion = document.querySelectorAll('#formulario-registro input');
            camposValidacion.forEach(campo => {
                campo.addEventListener('blur', function() {
                    if (this.checkValidity()) {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                    } else {
                        this.classList.remove('is-valid');
                        this.classList.add('is-invalid');
                    }
                });

                // Limpiar validación visual al escribir
                campo.addEventListener('input', function() {
                    if (this.classList.contains('is-invalid')) {
                        this.classList.remove('is-invalid');
                    }
                    if (this.classList.contains('is-valid')) {
                        this.classList.remove('is-valid');
                    }
                });
            });

            // Validación especial: Confirmar contraseña
            document.getElementById('confirmar_contrasenia').addEventListener('input', function() {
                const contrasenia = document.getElementById('contrasenia').value;
                const confirmar = this.value;
                
                if (confirmar && contrasenia !== confirmar) {
                    this.setCustomValidity('Las contraseñas no coinciden');
                    this.classList.add('is-invalid');
                } else {
                    this.setCustomValidity('');
                    this.classList.remove('is-invalid');
                    if (confirmar && contrasenia === confirmar) {
                        this.classList.add('is-valid');
                    }
                }
            });
        });
    </script>
</body>
</html>
