<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Accesorios</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/accesorios/list" hx-target="#accesorios-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/accesorios/form" hx-target="#accesorio-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>

      <!-- Buscar por ID -->
      <div class="mt-3 d-flex gap-2">
        
          <input class="form-control" type="text" id="idAccesorioInput" placeholder="Ingrese ID del accesorio">
          <button class="btn btn-primary ms-2" type="button" onclick="buscarAccesorioPorId()">Buscar</button>

          <!-- Buscar por Estado -->
          <select id="buscarEstadoAccesorio" class="form-select">
            <option value="">Buscar por estado...</option>
            <option value="Disponible">Disponible</option>
            <option value="Alquilado">Alquilado</option>
            <option value="Devuelto">Devuelto</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Sucio">Sucio</option>
          </select>
          <button class="btn btn-primary" onclick="buscarAccesorioPorEstado()">Buscar</button>

          <!-- Bottón descargar excel -->
          <button class="btn btn-outline-success mt-2" onclick="descargarExcel()">Exportar a Excel</button>
      </div>

  </div>
</div>

    <div id="resultadoAccesorio" class="mt-3"></div>
    <!-- 🔹 Aquí se mostrarán los resultados -->
    <div id="resultado-busqueda-estado-accesorio" class="mt-3"></div>

    <!-- Aca muestra la lista visibles cada vez que creas un producto -->
    <div id="accesorios-list"></div>
    <div id="accesorio-form" class="mt-3"></div>
    
    <script>

function buscarAccesorioPorId() {
  const id = document.getElementById('idAccesorioInput').value.trim();
  if (!id) return alert('Ingrese un ID');

  fetch(`/accesorios/getByIdAccesorio/${id}`)
    .then(response => {
      if (!response.ok) throw new Error('Error en la respuesta');
      return response.json();
    })
    .then(data => {
      const accesorio = data.data;
      let html = '';

      if (accesorio) {
        html = `
          <div class="card p-3 mb-2">
            <h5>Accesorio encontrado</h5>
            <div><strong>ID:</strong> ${accesorio.id}</div>
            <div><strong>Nombre:</strong> ${accesorio.nombre || '-'}</div>
            <div><strong>Tipo:</strong> ${accesorio.tipo || '-'}</div>
            <div><strong>Estado:</strong> ${accesorio.estado || '-'}</div>
            <div><strong>Descripción:</strong> ${accesorio.descripcion || '-'}</div>
          </div>
        `;
      } else {
        html = '<div>No se encontró el accesorio.</div>';
      }

      document.getElementById('resultadoAccesorio').innerHTML = html;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('resultadoAccesorio').innerHTML = '<div>Error al buscar el accesorio.</div>';
    });
}

    

    //Buscar por estado
    function buscarAccesorioPorEstado() {
        const estado = document.getElementById('buscarEstadoAccesorio').value;
        if (!estado) return alert('Seleccione un estado');

        fetch(`/accesorios/findAccesorioPorEstado/${estado}`)
            .then(response => response.json())
            .then(data => {
                console.log ("Respuesta completa:", data)
                const accesorios = data.data;
                let html = '';

                if (accesorios && accesorios.length > 0) {
                    html = `
                    <table class="table table-striped table-bordered mt-3">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Estado</th>
                                <th>Descripción</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                html += accesorios.map(acc => `
                    <tr>
                        <td>${acc.id}</td>
                        <td>${acc.nombre || '-'}</td>
                        <td>${acc.estado || '-'}</td>
                        <td>${acc.descripcion || '-'}</td>
                    </tr>
                `).join('');

                html += `
                        </tbody>
                    </table>
                `;
            } else {
                html = '<div class="alert alert-warning mt-3">No se encontraron accesorios con ese estado.</div>';
            }

                document.getElementById('resultado-busqueda-estado-accesorio').innerHTML = html;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('resultado-busqueda-estado-accesorio').innerHTML = '<div>Error al buscar accesorios</div>';
            });
    }

    
    function descargarExcel() {
    const estado = document.getElementById('buscarEstadoAccesorio').value;
    if (!estado) return alert('Seleccione un estado para exportar');
    window.location.href = `/accesorios/exportarExcel?estado=${estado}`;
}
    
    document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/accesorios/list','#accesorios-list'); });
    </script>
  </section>
</html>
