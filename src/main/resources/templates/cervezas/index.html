<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Cervezas</h2>
        <div>
          <button class="btn btn-outline-primary me-2" onclick="cargarCervezas()">Actualizar</button>
          <button class="btn btn-success" onclick="mostrarFormulario()">Nuevo</button>
        </div>
      </div>

      <!-- Buscadores agregados -->
      <!-- Buscar por ID -->
      <div class="row mt-3">
        <div class="col-md-4 d-flex">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Buscar por ID..." 
            id="buscar-id"
            name="id"
            autocomplete="off"
          >
          <button 
            class="btn btn-primary ms-2"
            type="button"
            onclick="buscarPorId()"
          >
            Buscar
          </button>

          <!-- Buscar por estado -->
        </div>
        <div class="col-md-4 d-flex">
          <select 
            class="form-select"
            id="buscar-estado"
            name="estado"
            autocomplete="off"
          >
            <option value="">Buscar por estado...</option>
            <option value="Disponible">Disponible</option>
            <option value="Agotada">Agotada</option>
            <option value="Producción">Producción</option>
            <option value="Mantenimiento">Mantenimiento</option>
          </select>
          <button 
            class="btn btn-primary ms-2"
            type="button"
            onclick="buscarPorEstado()"
          >
            Buscar
          </button>

    </div>

    <!-- Contenedor para mostrar resultados de la búsqueda por ID -->
    <div id="resultado-id" class="mt-3"></div>
    <!-- Contenedor donde se mostrará la lista filtrada por estado -->
    <div id="lista-cervezas-estado" class="mt-3"></div>


    <div id="cervezas-list">
      <p class="text-muted">Haz click en Actualizar para ver las cervezas</p>
    </div>
    
    <div id="cerveza-form" class="mt-3"></div>

<script>

    function buscarPorId() {
    const id = document.getElementById('buscar-id').value.trim();
    const contenedor = document.getElementById('resultado-id');

    if (!id) {
        contenedor.innerHTML = '<div class="alert alert-warning">Ingrese un ID válido</div>';
        return;
    }

    // Llamada al endpoint JSON que agregamos en el controller
    fetch('/cervezas/id/' + encodeURIComponent(id))
        .then(response => {
            if (!response.ok) {
                // si el servidor devolvió 404 o 500, mostrar alerta
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(respuesta => {
            // tu Respuesta tiene .codigo y .data (o .status)
            const ok = respuesta && (respuesta.codigo === '200' || respuesta.status === 'Ok');
            const data = respuesta ? respuesta.data : null;

            if (ok && data) {
                const c = data;
                const descripcion = c.descripcion || '-';
                const precio = (c.precioPorLitro != null) ? ('$' + Number(c.precioPorLitro).toFixed(2)) : '-';
                const amargor = (c.amargorIbu != null) ? c.amargorIbu : '-';
                const tipo = c.tipoCerveza || '-';
                const nombre = c.nombreCerveza || '-';
                const estado = c.estado || '-';
                const grado = (c.gradoAlcoholico != null) ? c.gradoAlcoholico : '-';
                const idMostrar = c.id != null ? c.id : id;

                contenedor.innerHTML = `
                    <div class="card p-3">
                        <h5 class="card-title">Cerveza ID: ${idMostrar}</h5>
                        <div class="row">
                          <div class="col-md-6">
                            <p><b>Nombre:</b> ${nombre}</p>
                            <p><b>Tipo:</b> ${tipo}</p>
                            <p><b>Grado Alcohólico:</b> ${grado}</p>
                          </div>
                          <div class="col-md-6">
                            <p><b>IBU:</b> ${amargor}</p>
                            <p><b>Precio/L:</b> ${precio}</p>
                            <p><b>Estado:</b> <span class="badge ${getBadgeClass(estado)}">${estado}</span></p>
                          </div>
                        </div>
                        <div class="mt-2"><b>Descripción:</b><p>${descripcion}</p></div>
                    </div>
                `;
            } else {
                contenedor.innerHTML = '<div class="alert alert-warning">No se encontró la cerveza con ese ID</div>';
            }
        })
        .catch(err => {
            console.error('buscarPorId error:', err);
            document.getElementById('resultado-id').innerHTML = '<div class="alert alert-danger">Error al buscar la cerveza</div>';
        });
}

// Si ya tenés getBadgeClass en otro lugar, no hace falta; si no, pegá esto:
function getBadgeClass(estado) {
    switch (estado) {
        case 'Disponible': return 'bg-success';
        case 'Agotada': return 'bg-danger';
        case 'Produccion': return 'bg-primary';
        case 'Mantenimiento': return 'bg-warning';
        default: return 'bg-secondary';
    }
}



        function buscarPorEstado() {
            const estado = document.getElementById('buscar-estado').value;

            if (!estado) {
                document.getElementById('lista-cervezas-estado').innerHTML =
                    '<div class="alert alert-warning">Seleccione un estado</div>';
                return;
            }

            // Llamada al endpoint que ahora devuelve JSON
            fetch('/cervezas/buscar-por-estado/' + encodeURIComponent(estado))
                .then(response => {
                    if (!response.ok) throw new Error('HTTP error ' + response.status);
                    return response.json();
                })
                .then(respuesta => {
                    // tu servicio devuelve un objeto Respuesta { codigo: "200", data: [...] }
                    if (respuesta && (respuesta.codigo === '200' || respuesta.status === 'Ok')) {
                        const cervezas = Array.isArray(respuesta.data) ? respuesta.data : [];
                        mostrarListaCervezasPorEstado(cervezas, estado);
                        // si tenés botones de descarga, activalos (opcional)
                        const excelBtn = document.getElementById('descargar-excel');
                        const pdfBtn = document.getElementById('descargar-pdf');
                        if (excelBtn) {
                            excelBtn.style.display = cervezas.length ? 'inline-block' : 'none';
                            excelBtn.setAttribute('data-estado', estado);
                            excelBtn.href = '/cervezas/exportar-estado-excel/' + encodeURIComponent(estado);
                        }
                        if (pdfBtn) {
                            pdfBtn.style.display = cervezas.length ? 'inline-block' : 'none';
                            pdfBtn.setAttribute('data-estado', estado);
                            // si tenés endpoint para pdf ajustar href
                            pdfBtn.href = '/cervezas/exportar-estado-pdf/' + encodeURIComponent(estado);
                        }
                    } else {
                        document.getElementById('lista-cervezas-estado').innerHTML =
                            '<div class="alert alert-warning">No se encontraron cervezas en el estado seleccionado</div>';
                    }
                })
                .catch(err => {
                    console.error('Error buscarPorEstado:', err);
                    document.getElementById('lista-cervezas-estado').innerHTML =
                        '<div class="alert alert-danger">⚠️ Error al buscar por estado</div>';
                });
        }

function mostrarListaCervezasPorEstado(cervezas, estadoLabel) {
    let html = `
        <div class="card p-3">
            <h5>Cervezas en estado "${estadoLabel}" <span class="badge bg-secondary">${cervezas ? cervezas.length : 0}</span></h5>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th><th>Nombre</th><th>Tipo</th><th>Grado Alc.</th><th>IBU</th><th>Precio/L</th><th>Estado</th><th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody>`;

    if (cervezas && cervezas.length > 0) {
        cervezas.forEach(c => {
            html += `<tr>
                <td>${c.id ?? ''}</td>
                <td>${c.nombreCerveza ?? ''}</td>
                <td>${c.tipoCerveza ?? ''}</td>
                <td>${c.gradoAlcoholico != null ? c.gradoAlcoholico + '°' : ''}</td>
                <td>${c.amargorIbu != null ? c.amargorIbu : ''}</td>
                <td>${c.precioPorLitro != null ? '$' + Number(c.precioPorLitro).toFixed(2) : ''}</td>
                <td><span class="badge ${getBadgeClass(c.estado)}">${c.estado ?? ''}</span></td>
                <td>${c.descripcion ? (c.descripcion.length > 80 ? c.descripcion.substring(0,80) + '...' : c.descripcion) : 'Sin descripción'}</td>
            </tr>`;
        });
    } else {
        html += `<tr><td colspan="8" class="text-center text-muted">No hay cervezas en este estado</td></tr>`;
    }

    html += `</tbody></table></div></div>`;
    document.getElementById('lista-cervezas-estado').innerHTML = html;
}

// (Opcional) usa ya la función que tenías; si no, agrega:
function getBadgeClass(estado) {
    switch (estado) {
        case 'Disponible': return 'bg-success';
        case 'Agotada': return 'bg-danger';
        case 'Produccion': return 'bg-primary';
        case 'Mantenimiento': return 'bg-warning';
        default: return 'bg-secondary';
    }
}



    function cargarCervezas() {
        fetch('/getAllCerveza')
            .then(response => response.json())
            .then(data => {
                if (data.codigo === '200') {
                    mostrarListaCervezas(data.data);
                }
            });
    }
    
    function mostrarListaCervezas(cervezas) {
        let html = `
        <div class="card p-3">
            <h5>Lista de Cervezas <span class="badge bg-secondary">${cervezas ? cervezas.length : 0}</span></h5>
            
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Grado Alc.</th>
                            <th>IBU</th>
                            <th>Precio/L</th>
                            <th>Estado</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>`;
        
        if (cervezas && cervezas.length > 0) {
            cervezas.forEach(cerveza => {
                html += `
                    <tr>
                        <td><strong>${cerveza.id || 'N/A'}</strong></td>
                        <td>${cerveza.nombreCerveza || 'N/A'}</td>
                        <td>${cerveza.tipoCerveza || 'N/A'}</td>
                        <td>${cerveza.gradoAlcoholico ? cerveza.gradoAlcoholico + '°' : 'N/A'}</td>
                        <td>
                            <span class="badge ${cerveza.amargorIbu >= 1 ? 'bg-info' : 'bg-warning'}">
                                ${cerveza.amargorIbu || 'N/A'}
                            </span>
                        </td>
                        <td>${cerveza.precioPorLitro ? '$' + cerveza.precioPorLitro.toFixed(2) : 'N/A'}</td>
                        <td>
                            <span class="badge ${getBadgeClass(cerveza.estado)}">
                                ${cerveza.estado || 'N/A'}
                            </span>
                        </td>
                        <td>
                            <small class="text-muted">${cerveza.descripcion ? (cerveza.descripcion.length > 50 ? cerveza.descripcion.substring(0, 50) + '...' : cerveza.descripcion) : 'Sin descripción'}</small>
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-primary" onclick="editarCerveza(${cerveza.id})" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-danger" onclick="eliminarCerveza(${cerveza.id})" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
            });
        } else {
            html += `
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="bi bi-inbox display-4"></i><br>
                            No hay cervezas cargadas
                        </td>
                    </tr>`;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
        </div>`;
        
        document.getElementById('cervezas-list').innerHTML = html;
    }
    
    function getBadgeClass(estado) {
        switch(estado) {
            case 'Disponible': return 'bg-success';
            case 'Agotada': return 'bg-danger';
            case 'Produccion': return 'bg-primary';
            case 'Mantenimiento': return 'bg-warning';
            default: return 'bg-secondary';
        }
    }
    
    function editarCerveza(id) {
        fetch('/getByIdCerveza/' + id)
            .then(response => response.json())
            .then(data => {
                if (data.codigo === '200') {
                    const cerveza = data.data;
                    mostrarFormularioEdicion(cerveza);
                } else {
                    alert('Error al cargar la cerveza: ' + data.descripcion);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al cargar la cerveza para editar');
            });
    }
    
    function mostrarFormularioEdicion(cerveza) {
        const formHtml = `
            <div class="card p-3">
                <h5>Editar Cerveza: ${cerveza.nombreCerveza}</h5>
                <form onsubmit="actualizarCerveza(event, ${cerveza.id})">
                    <input type="hidden" id="id" value="${cerveza.id}">
                    
                    <div class="mb-2">
                        <label>Nombre *</label>
                        <input type="text" class="form-control" id="edit-nombre" value="${cerveza.nombreCerveza || ''}" required>
                    </div>
                    
                    <div class="mb-2">
                        <label>Tipo *</label>
                        <input type="text" class="form-control" id="edit-tipo" value="${cerveza.tipoCerveza || ''}" required>
                    </div>
                    
                    <div class="mb-2">
                        <label>Grado Alcohólico *</label>
                        <input type="number" step="0.1" class="form-control" id="edit-grado" value="${cerveza.gradoAlcoholico || ''}" required>
                    </div>
                    
                    <div class="mb-2">
                        <label>IBU * (Mínimo 1)</label>
                        <input type="number" min="1" class="form-control" id="edit-ibu" value="${cerveza.amargorIbu || ''}" required>
                        <small class="text-danger" id="edit-ibu-error" style="display:none;">IBU debe ser ≥ 1</small>
                    </div>
                    
                    <div class="mb-2">
                        <label>Precio por Litro</label>
                        <input type="number" step="0.01" class="form-control" id="edit-precio" value="${cerveza.precioPorLitro || ''}">
                    </div>
                    
                    <div class="mb-2">
                        <label>Descripción</label>
                        <textarea class="form-control" id="edit-descripcion" rows="2">${cerveza.descripcion || ''}</textarea>
                    </div>
                    
                    <div class="mb-2">
                        <label>Estado *</label>
                        <select class="form-control" id="edit-estado" required>
                            <option value="">Seleccione...</option>
                            <option value="Disponible" ${cerveza.estado === 'Disponible' ? 'selected' : ''}>Disponible</option>
                            <option value="Agotada" ${cerveza.estado === 'Agotada' ? 'selected' : ''}>Agotada</option>
                            <option value="Produccion" ${cerveza.estado === 'Produccion' ? 'selected' : ''}>Producción</option>
                            <option value="Mantenimiento" ${cerveza.estado === 'Mantenimiento' ? 'selected' : ''}>Mantenimiento</option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Actualizar</button>
                        <button type="button" class="btn btn-secondary" onclick="cancelarEdicion()">Cancelar</button>
                    </div>
                </form>
            </div>
        `;
        
        document.getElementById('cerveza-form').innerHTML = formHtml;
        document.getElementById('cerveza-form').scrollIntoView({ behavior: 'smooth' });
    }
    
    function actualizarCerveza(event, id) {
        event.preventDefault();
        
        const ibu = parseInt(document.getElementById('edit-ibu').value);
        if (ibu < 1) {
            document.getElementById('edit-ibu-error').style.display = 'block';
            alert('El IBU debe ser mayor o igual a 1');
            return;
        }
        
        const cervezaData = {
            id: id,
            nombreCerveza: document.getElementById('edit-nombre').value,
            tipoCerveza: document.getElementById('edit-tipo').value,
            gradoAlcoholico: parseFloat(document.getElementById('edit-grado').value),
            amargorIbu: ibu,
            precioPorLitro: parseFloat(document.getElementById('edit-precio').value) || 0,
            descripcion: document.getElementById('edit-descripcion').value,
            estado: document.getElementById('edit-estado').value
        };
        
        fetch('/updateCerveza', {
            method: 'PUT',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cervezaData)
        })
        .then(response => {
            console.log('Status de respuesta:', response.status);
            if (!response.ok) {
                throw new Error('Error HTTP: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            console.log('Respuesta del servidor:', data);
            if (data.codigo === '200' || data.status === 'Ok') {
                alert('✅ Cerveza actualizada correctamente');
                document.getElementById('cerveza-form').innerHTML = '';
                cargarCervezas();
            } else {
                alert('❌ Error: ' + (data.descripcion || data.message || 'Error desconocido'));
            }
        })
        .catch(error => {
            console.error('Error completo:', error);
            alert('❌ Error al actualizar la cerveza: ' + error.message);
        });
    }
    
    function cancelarEdicion() {
        document.getElementById('cerveza-form').innerHTML = '';
    }
    
    function eliminarCerveza(id) {
        if (confirm('¿Estás seguro de eliminar esta cerveza?')) {
            fetch('/deleteCerveza/' + id, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.codigo === '200') {
                        cargarCervezas();
                        alert('Cerveza eliminada correctamente');
                    } else {
                        alert('Error: ' + data.descripcion);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al eliminar la cerveza');
                });
        }
    }
    
    function mostrarFormulario() {
        fetch('/cervezas/form')
            .then(response => response.text())
            .then(html => {
                document.getElementById('cerveza-form').innerHTML = html;
                document.getElementById('cerveza-form').scrollIntoView({ behavior: 'smooth' });
            });
    }

    // 🚀 Enganchar envío del formulario dinámico
    document.addEventListener("submit", async function (e) {
        if (e.target && e.target.id === "formCerveza") {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);
            const jsonData = {};
            formData.forEach((value, key) => {
                if (['gradoAlcoholico', 'amargorIbu', 'precioPorLitro'].includes(key)) {
                    jsonData[key] = parseFloat(value);
                } else {
                    jsonData[key] = value;
                }
            });

            try {
                const response = await fetch("/addCerveza", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(jsonData)
                });

                const result = await response.json();
                console.log("Respuesta backend:", result);

                if (response.ok && (result.codigo === "200" || result.status === "Ok")) {
                    alert("✅ Cerveza guardada correctamente");
                    form.reset();
                    document.getElementById("cerveza-form").innerHTML = "";
                    cargarCervezas();
                } else {
                    alert("❌ Error: " + (result.descripcion || JSON.stringify(result)));
                }
            } catch (err) {
                console.error("Excepción:", err);
                alert("⚠️ No se pudo conectar con el servidor");
            }
        }
    });

    // Cargar automáticamente al iniciar
    cargarCervezas();
    </script>
  </section>
</html>
