<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Firmas</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/firmas/list" hx-target="#firmas-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/firmas/form" hx-target="#firma-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

    <div id="#firmas-list"></div>
    <div id="#firma-form" class="mt-3"></div>
    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/firmas/list','#firmas-list'); });</script>
  </section>
</html>
