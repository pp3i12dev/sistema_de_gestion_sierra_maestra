<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay firmas.</div>
    <div th:each="f : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${f.id}">ID</strong>
          <div class="muted" th:text="${f.nombre}">Nombre</div>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/firmas/save}" th:object="${firma}" hx-post="/firmas/save" hx-target="#firmas-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Nombre</label>
        <input class="form-control" th:field="*{nombre}" />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="htmx.ajax('GET','/firmas/list','#firmas-list')">Cancelar</button>
      </div>
    </form>
  </div>
</html>
