<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Maduradores</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/maduradores/list" hx-target="#maduradores-list" hx-swap="innerHTML">Actualizar</button>
          <button class="btn btn-success" hx-get="/maduradores/form" hx-target="#madurador-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>

      <!-- 🔹 Buscador por ID -->
      <div class="mt-3 d-flex gap-2">
        <input type="number" id="buscarId" class="form-control" placeholder="Ingrese ID del madurador" />
        <button class="btn btn-primary" onclick="buscarMaduradorPorId()">Buscar</button>

         <!-- 🔹 Buscador por Estado -->
        <select id="buscarEstado" class="form-select">
            <option value="">Seleccione estado</option>
            <option value="Activo">Activo</option>
            <option value="Cargado">Cargado</option>
            <option value="Sucio">Sucio</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Inactivo">Inactivo</option>
        </select>
        <button class="btn btn-primary" onclick="buscarMaduradoresPorEstado()">Buscar</button>

        <button class="btn btn-success ms-2" onclick="descargarMaduradoresPorEstado()">
            Descargar Excel
        </button>
      </div>

    <!-- Div para mostrar el resultado -->
    <div id="resultado-busqueda" class="mt-3"></div>
    <!-- Div para mostrar la lista filtrada -->
    <div id="resultado-busqueda-estado" class="mt-3"></div>

  <div id="maduradores-list"></div>
  <div id="madurador-form" class="mt-3"></div>

  
    <script>
    //Realiza una busqueda por ID
    function buscarMaduradorPorId() {
  const id = document.getElementById('buscarId').value;
  if (!id) return alert('Ingrese un ID');

  fetch(`/getByIdMadurador/${id}`)
    .then(response => response.json())
    .then(data => {
      const m = data.data;
      let html = '';
      if (m) {
        html = `
          <div class="card p-3 mb-2">
            <h6>Detalle Madurador</h6>
            <div><strong>Id:</strong> ${m.id}</div>
            <div><strong>Litros:</strong> ${m.litros}</div>
            <div><strong>Estado:</strong> ${m.estado}</div>
            <div><strong>Notas:</strong> ${m.notas || '-'}</div>
            <div><strong>Lote:</strong> ${m.lote ? m.lote.id : '-'}</div>
          </div>`;
      } else {
        html = '<div>No se encontró el madurador.</div>';
      }
      document.getElementById('resultado-busqueda').innerHTML = html;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('resultado-busqueda').innerHTML = '<div>Error al buscar madurador</div>';
    });
}

      //REALIZA UNA BUSQUEDA POR ESTADO
 /* Buscar maduradores por estado (muestra tabla con todas las filas) */
function buscarMaduradoresPorEstado() {
  const estado = document.getElementById('buscarEstado').value;
  if (!estado) return alert('Seleccione un estado');

  fetch(`/finByEstado/${encodeURIComponent(estado)}`)
    .then(response => {
      if (!response.ok) throw new Error('Error en la respuesta del servidor');
      return response.json();
    })
    .then(data => {
      const maduradores = Array.isArray(data.data) ? data.data : [];
      let html = '';

      if (maduradores.length > 0) {
        html = `
          <table class="table table-striped table-hover mt-3">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Litros</th>
                <th>Estado</th>
                <th>Notas</th>
                <th>Lote</th>
              </tr>
            </thead>
            <tbody>
              ${maduradores.map(m => `
                <tr>
                  <td>${m.id ?? '-'}</td>
                  <td>${m.litros ?? '-'}</td>
                  <td>${m.estado ?? '-'}</td>
                  <td>${m.notas ?? '-'}</td>
                  <td>${(m.lote && m.lote.id) ? m.lote.id : '-'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else {
        html = '<div class="alert alert-warning">No se encontraron maduradores con ese estado.</div>';
      }

      document.getElementById('resultado-busqueda-estado').innerHTML = html;
    })
    .catch(err => {
      console.error(err);
      document.getElementById('resultado-busqueda-estado').innerHTML = '<div class="alert alert-danger">Error al buscar maduradores</div>';
    });
}


    function descargarMaduradoresPorEstado() {
        const estado = document.getElementById('buscarEstado').value;
        if (!estado) return alert('Seleccione un estado');

        // Abrir la descarga en una nueva ventana
        window.open(`/maduradores/exportarExcel/${encodeURIComponent(estado)}`, '_blank');
    }


    
    document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/maduradores/list','#maduradores-list'); });</script>
  </section>
</html>
