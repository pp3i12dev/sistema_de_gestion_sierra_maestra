<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Porcentajes Mes</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/porcentajes-mes/list" hx-target="#porcentajes-mes-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/porcentajes-mes/form" hx-target="#porcentajes-mes-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

  <div id="porcentajes-mes-list"></div>
  <div id="porcentajes-mes-form" class="mt-3"></div>
  <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/porcentajes-mes/list','#porcentajes-mes-list'); });</script>
  </section>
</html>
