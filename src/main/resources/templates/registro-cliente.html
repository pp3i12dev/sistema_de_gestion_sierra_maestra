    <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f1cf10cc 0%, #ddb70d 50%, #ecaf08 100%);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, rgb(99, 57, 18), rgb(2, 1, 0) 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;

                /* Hero Section */
        .hero {
            height: 30vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 80px;
            background: radial-gradient(ellipse at center, rgba(182, 185, 16, 0.1) 0%, transparent 70%);
        }

        .hero-content {
            text-align: center;
            z-index: 10;
            animation: fadeInUp 2s ease;
            position: relative;
        }
        
        .logo {

            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;

        .logo:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;

            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);

        .nav-item:hover {

        /* Main Content */

        /* Burbujas de cerveza */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }
            .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-top: 1.4rem;
            opacity: 2;
            background: linear-gradient(135deg, rgb(21, 156, 9),rgb(255, 238, 0), rgba(255, 8, 8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: ripple 3s ease-in-out infinite, waveGlow 4s ease-in-out infinite alternate  ;
        }
                @keyframes waveGlow {
            0% { 
                text-shadow: 0 0 30px rgba(64, 212, 6, 0.8),
                           0 0 60px rgba(36, 238, 18, 0.6);
            }
            50% { 
                text-shadow: 0 0 40px rgb(213, 250, 2),
                             0 0 200px rgb(240, 236, 6),
                           0 0 200px rgba(255, 238, 2, 0.993);
            }
            100% { 
                text-shadow: 0 0 40px rgb(255, 30, 0),
                           0 0 80px rgba(255, 2, 2, 0.925),
                           0 0 200px rgba(250, 0, 0, 0.932);
            }
        }

        @keyframes ripple {
            0%, 100% { opacity: 0.8; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        @keyframes rise {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(var(--drift)) scale(0.8);
            }
        }

            max-width: 1000px;

        /* Success Message */
        .success-message {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(218, 165, 32, 0.5);
            display: none;
            border: 3px solid #FFD700;
            position: relative;
            overflow: hidden;
        }
        
        .success-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin: 1rem 0;
            display: none;
        }
        
        /* Buttons */
        .btn-register {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border: 2px solid #DAA520;
            padding: 1rem 3rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto;

        .btn-register:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4);
        }
        
        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Back Button */
        .btn-back {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;

        .btn-back:hover {

            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: white;

        /* Responsive */
        @media (max-width: 768px) {

        }

        }

<script>
document.addEventListener('DOMContentLoaded', function() {
    const formulario = document.getElementById('formulario-registro');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
    const btnRegistrar = document.getElementById('btn-registrar');

            // Función para mostrar mensajes
    function mostrarMensaje(mensaje, tipo) {
        if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            // Función para validar formulario
    function validarFormulario() {
        const contrasenia = document.getElementById('contrasenia').value;
        const confirmarContrasenia = document.getElementById('confirmar_contrasenia').value;
        
        // Validar que las contraseñas coincidan
        if (contrasenia !== confirmarContrasenia) {
            document.getElementById('confirmar_contrasenia').setCustomValidity('Las contraseñas no coinciden');
            return false;
        } else {
            document.getElementById('confirmar_contrasenia').setCustomValidity('');
        }

        // Validar campos requeridos
        const camposRequeridos = [
            'nombre', 'apellido', 'documento', 'fecha_nacimiento', 
            'mail', 'direccion', 'telefono', 'contrasenia', 'confirmar_contrasenia'
        ];

        let esValido = true;
        camposRequeridos.forEach(campo => {
            const elemento = document.getElementById(campo);
            if (!elemento.checkValidity()) {
                elemento.classList.add('is-invalid');
                esValido = false;
            } else {
                elemento.classList.remove('is-invalid');
                        elemento.classList.add('is-valid');
            }
        });

        return esValido;
    }

            // Event listener para el formulario
    formulario.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Validar formulario antes de enviar
        if (!validarFormulario()) {
                    mostrarMensaje('Por favor corrija los errores en el formulario', 'error');
            return;
        }

        // Deshabilitar botón para evitar envíos múltiples
        btnRegistrar.disabled = true;
                btnRegistrar.textContent = 'Registrando...';

        try {
            // Preparar datos del formulario
            const formData = new FormData(formulario);
            const clienteData = {
                nombre: formData.get('nombre'),
                apellido: formData.get('apellido'),
                documento: formData.get('documento'),
                fecha_nacimiento: formData.get('fecha_nacimiento'),
                mail: formData.get('mail'),
                direccion: formData.get('direccion'),
                telefono: formData.get('telefono'),
                cuit: formData.get('cuit') || null,
                contrasenia: formData.get('contrasenia')
            };

            // Enviar petición al backend
            const response = await fetch('/registrarCliente', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(clienteData)
            });

            const resultado = await response.json();

            if (response.ok) {
                // CREACIÓN DE CUENTA EXITOSA
                        mostrarMensaje('', 'success');
                formulario.reset();
                
                        // Mostrar mensaje de éxito más prominente
                        successMessage.style.display = 'block';
                        successMessage.style.animation = 'pulse 0.5s ease-in-out';
                        successMessage.innerHTML = '¡REGISTRADO CON ÉXITO!';
                        
                        // Scroll hacia el mensaje de éxito
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // Redirigir al home después de 4 segundos
                setTimeout(() => {
                            window.location.href = '/inicio';
                        }, 4000);
                } else {
                    // ERROR EN LA CREACIÓN DE CUENTA
                    if (response.status === 409) {
                        // Conflicto: DNI o email ya existe
                            mostrarMensaje(resultado.data || resultado.descripcion, 'error');
                    } else {
                        // Otros errores
                            mostrarMensaje(resultado.data || 'Error al crear la cuenta. Intente nuevamente.', 'error');
                        }
                }

        } catch (error) {
            // ERROR DE CONEXIÓN
            console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Verifique su internet e intente nuevamente.', 'error');
        } finally {
            // Rehabilitar botón
            btnRegistrar.disabled = false;
                    btnRegistrar.textContent = 'Registrarte';
        }
    });

            // Validaciones en tiempo real
    const camposValidacion = document.querySelectorAll('#formulario-registro input');
    camposValidacion.forEach(campo => {
        campo.addEventListener('blur', function() {
            if (this.checkValidity()) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            } else {
                this.classList.remove('is-valid');
                this.classList.add('is-invalid');
            }
        });

        // Limpiar validación visual al escribir
        campo.addEventListener('input', function() {
            if (this.classList.contains('is-invalid')) {
                this.classList.remove('is-invalid');
            }
            if (this.classList.contains('is-valid')) {
                this.classList.remove('is-valid');
            }
        });
    });

            // Validación especial: Confirmar contraseña
    document.getElementById('confirmar_contrasenia').addEventListener('input', function() {
        const contrasenia = document.getElementById('contrasenia').value;
        const confirmar = this.value;
        
        if (confirmar && contrasenia !== confirmar) {
            this.setCustomValidity('Las contraseñas no coinciden');
            this.classList.add('is-invalid');
        } else {
            this.setCustomValidity('');
            this.classList.remove('is-invalid');
            if (confirmar && contrasenia === confirmar) {
                this.classList.add('is-valid');
            }
        }
    });
});
</script>
</body>
</html>
