<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear una cuenta - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f1cf10cc 0%, #ddb70d 50%, #ecaf08 100%);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, rgb(99, 57, 18), rgb(2, 1, 0) 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid #DAA520;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #DAA520;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
        }
        
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .logo-text {
            color: #ffffffbe;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-item {
            color: #ceb7a5b2;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-item:hover {
            background-color: rgba(216, 190, 124, 0.3);
            color: #c46a0a;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            border: 2px solid #DAA520;
            color: #583207;
            font-weight: bold;
        }
        
        .nav-item.active:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(218, 165, 32, 0.4);
        }
        
        /* Main Content */
        .main-content {
            background: transparent;
            min-height: calc(100vh - 80px);
            padding-top: 90px;
            position: relative;
            overflow: hidden;
        }
        
        /* Burbujas de cerveza */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }
        
        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-top: 1.4rem;
            opacity: 2;
            background: linear-gradient(135deg, rgb(21, 156, 9),rgb(255, 238, 0), rgba(255, 8, 8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: ripple 3s ease-in-out infinite, waveGlow 4s ease-in-out infinite alternate;
        }
        
        @keyframes waveGlow {
            0% { 
                text-shadow: 0 0 30px rgba(64, 212, 6, 0.8),
                           0 0 60px rgba(36, 238, 18, 0.6);
            }
            50% { 
                text-shadow: 0 0 40px rgb(213, 250, 2),
                             0 0 200px rgb(240, 236, 6),
                           0 0 200px rgba(255, 238, 2, 0.993);
            }
            100% { 
                text-shadow: 0 0 40px rgb(255, 30, 0),
                           0 0 80px rgba(255, 2, 2, 0.925),
                           0 0 200px rgba(250, 0, 0, 0.932);
            }
        }

        @keyframes ripple {
            0%, 100% { opacity: 0.8; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        
        @keyframes rise {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
           100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(var(--drift)) scale(0.8);
            }
        }
        
        .bubble:nth-child(1) { width: 8px; height: 8px; left: 5%; animation-duration: 8s; animation-delay: 0s; --drift: 10px; }
        .bubble:nth-child(2) { width: 12px; height: 12px; left: 10%; animation-duration: 10s; animation-delay: 2s; --drift: -15px; }
        .bubble:nth-child(3) { width: 10px; height: 10px; left: 15%; animation-duration: 9s; animation-delay: 1s; --drift: 8px; }
        .bubble:nth-child(4) { width: 6px; height: 6px; left: 20%; animation-duration: 7s; animation-delay: 3s; --drift: -12px; }
        .bubble:nth-child(5) { width: 14px; height: 14px; left: 25%; animation-duration: 11s; animation-delay: 0.5s; --drift: 18px; }
        .bubble:nth-child(6) { width: 8px; height: 8px; left: 30%; animation-duration: 8.5s; animation-delay: 2.5s; --drift: -10px; }
        .bubble:nth-child(7) { width: 11px; height: 11px; left: 35%; animation-duration: 9.5s; animation-delay: 1.5s; --drift: 12px; }
        .bubble:nth-child(8) { width: 7px; height: 7px; left: 40%; animation-duration: 7.5s; animation-delay: 3.5s; --drift: -8px; }
        .bubble:nth-child(9) { width: 13px; height: 13px; left: 45%; animation-duration: 10.5s; animation-delay: 1s; --drift: 15px; }
        .bubble:nth-child(10) { width: 9px; height: 9px; left: 50%; animation-duration: 8s; animation-delay: 4s; --drift: -9px; }
        
        .form-container {
            max-width: 1000px;
            margin: 0 auto;     
            background: linear-gradient(135deg, #dfba15f8 0%, #eca814 100%); 
            border: 2px solid #DAA520; 
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #333; 
            padding: 2rem 3rem;
        }
        
        .form-container h1 {
            color: #47138b;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .form-label {
            color: #8B4513;
            font-weight: 600;
            min-width: 120px;
            text-align: right;
        }
        
        .form-control {
            background-color: white;
            border: 2px solid #DAA520;
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1rem;
            color: #333;
            flex-grow: 1;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }
        
        .form-control::placeholder {
            color: #999;
        }

        /* Tipo Cliente Selector */
        .tipo-cliente-selector {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .tipo-cliente-option {
            flex: 1;
            max-width: 200px;
        }
        
        .tipo-cliente-btn {
            width: 100%;
            padding: 1rem;
            border: 3px solid #DAA520;
            border-radius: 10px;
            background: white;
            color: #8B4513;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .tipo-cliente-btn:hover {
            background: #FFF8E1;
            transform: translateY(-2px);
        }
        
        .tipo-cliente-btn.active {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border-color: #FFD700;
            box-shadow: 0 5px 15px rgba(218, 165, 32, 0.4);
        }
        
        /* Campos condicionales */
        .campo-condicional {
            transition: all 0.3s ease;
        }
        
        .campo-condicional.hidden {
            display: none;
        }
        
        .campo-requerido::after {
            content: " *";
            color: #dc3545;
        }
        
        /* Success Message */
        .success-message {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(218, 165, 32, 0.5);
            display: none;
            border: 3px solid #FFD700;
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin: 1rem 0;
            display: none;
        }
        
        /* Buttons */
        .btn-register {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border: 2px solid #DAA520;
            padding: 1rem 3rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto;
        }
        
        .btn-register:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4);
        }
        
        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .form-group {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            
            .form-label {
                text-align: left;
                min-width: auto;
            }
            
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .form-container {
                padding: 1.5rem;
            }
            
            .tipo-cliente-selector {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            
            .tipo-cliente-option {
                max-width: 100%;
            }
        }
        
        /* Validation Styles */
        .form-control.is-valid {
            border-color: #28a745;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
        }
        
        .invalid-feedback {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        
        /* Estilos para auto-completado de CUIT */
        .cuit-helper {
            font-size: 0.8rem;
            color: #28a745;
            margin-top: 0.25rem;
            display: none;
        }
        
        .form-control.auto-filled {
            background-color: #f8fff8;
            border-color: #28a745;
        }
        
        /* Indicador visual de extracción exitosa */
        .dni-extracted {
            animation: pulse-green 0.5s ease-in-out;
        }
        
        @keyframes pulse-green {
            0% { background-color: transparent; }
            50% { background-color: rgba(40, 167, 69, 0.1); }
            100% { background-color: transparent; }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a th:href="@{/inicio}" class="logo" style="text-decoration: none; cursor: pointer;">
            <div class="logo-circle">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">   
            </div>
            <div class="logo-text">Sierra Maestra</div>
        </a>
        <p class="subtitle">Para todos la luz, para todos todo</p>
        
        <nav class="nav-menu">
            <a href="#cervezas" class="nav-item">Nuestras Cervezas</a>
            <a href="#promos" class="nav-item">Promos</a>
            <a href="#quienes-somos" class="nav-item">¿Quiénes somos?</a>
            <a th:href="@{/inicio}" class=" nav-item active" id="btn-iniciar-sesion">Iniciar sesión</a>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Burbujas de cerveza -->
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        
        <div class="form-container">
            <h1>Crear Cuenta</h1>

            <!-- Success Message -->
            <div id="success-message" class="success-message">
                ¡REGISTRADO CON ÉXITO!
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message">
                <!-- Error messages will be inserted here -->
            </div>

            <!-- Tipo Cliente Selector -->
            <div class="tipo-cliente-selector">
                <div class="tipo-cliente-option">
                    <button type="button" class="tipo-cliente-btn active" data-tipo="cliente">
                        <i class="bi bi-person-fill"></i><br>
                        Cliente Individual
                    </button>
                </div>
                <div class="tipo-cliente-option">
                    <button type="button" class="tipo-cliente-btn" data-tipo="empresa">
                        <i class="bi bi-building"></i><br>
                        Empresa
                    </button>
                </div>
            </div>

            <!-- Registration Form -->
            <form id="formulario-registro" novalidate>
                <input type="hidden" id="tipo" name="tipo" value="cliente">
                
                <div class="form-row">
                    <!-- Left Column -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="nombre" class="form-label campo-requerido">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required
                                   placeholder="Ingrese su nombre">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="documento" class="form-label campo-requerido">DNI</label>
                            <input type="text" 
                                   class="form-control" 
                                   id="documento" 
                                   name="documento" 
                                   required
                                   placeholder="Ej: 12345678 (7 u 8 dígitos)" 
                                   maxlength="8"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <div class="invalid-feedback">El DNI debe contener 7 u 8 dígitos numéricos</div>
                        </div>

                        <div class="form-group">
                            <label for="mail" class="form-label campo-requerido">Email</label>
                            <input type="email" class="form-control" id="mail" name="mail" required
                                   placeholder="ejemplo@email.com">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="fecha_nacimiento" class="form-label campo-requerido">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                    
                    <!-- Right Column -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="apellido" class="form-label campo-requerido">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" required
                                   placeholder="Ingrese su apellido">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group campo-condicional hidden" id="grupo-razon-social">
                            <label for="razon_social" class="form-label campo-requerido">Razón Social</label>
                            <input type="text" class="form-control" id="razon_social" name="razon_social"
                                   placeholder="Nombre legal de la empresa">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="direccion" class="form-label campo-requerido">Dirección</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" required
                                   placeholder="Calle, número, ciudad">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group">
                            <label for="telefono" class="form-label campo-requerido">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" required
                                   placeholder="Ej: 1123456789" maxlength="15">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="form-group campo-condicional hidden" id="grupo-cuit">
                            <label for="cuit" class="form-label">CUIT</label>
                            <input type="text" class="form-control" id="cuit" name="cuit"
                                   placeholder="Ej: 20-12345678-9">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                </div>

                <!-- Password Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="contrasenia" class="form-label campo-requerido">Contraseña</label>
                        <input type="password" class="form-control" id="contrasenia" name="contrasenia" required
                               placeholder="Mínimo 6 caracteres" minlength="6">
                        <div class="invalid-feedback"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmar_contrasenia" class="form-label campo-requerido">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="confirmar_contrasenia" required
                               placeholder="Repita su contraseña">
                        <div class="invalid-feedback"></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-register" id="btn-registrar">
                    Registrarte
                </button>
                
                <!-- Back Button -->
                <button type="button" class="btn-register" onclick="window.location.href='http://localhost:8080/'">   
                    <i class="bi bi-arrow-left"></i>
                    Volver
                </button>
            </form>
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const formulario = document.getElementById('formulario-registro');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            const btnRegistrar = document.getElementById('btn-registrar');
            const tipoInput = document.getElementById('tipo');

            // URL base de la API
            const API_BASE_URL = 'http://localhost:8080';
            const API_ENDPOINT = '/addCliente';

            // Manejar selección del tipo de cliente
            document.querySelectorAll('.tipo-cliente-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remover clase active de todos los botones
                    document.querySelectorAll('.tipo-cliente-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    
                    // Agregar clase active al botón clickeado
                    this.classList.add('active');
                    
                    // Actualizar el valor del tipo
                    const tipo = this.getAttribute('data-tipo');
                    tipoInput.value = tipo;
                    
                    // Mostrar/ocultar campos según el tipo
                    actualizarCamposPorTipo(tipo);
                });
            });

            function actualizarCamposPorTipo(tipo) {
                const grupoCUIT = document.getElementById('grupo-cuit');
                const grupoRazonSocial = document.getElementById('grupo-razon-social');
                
                if (tipo === 'cliente') {
                    // Mostrar campos de cliente individual
                    grupoCUIT.classList.add('hidden');
                    grupoRazonSocial.classList.add('hidden');
                    
                    // Hacer requeridos los campos de cliente
                    document.getElementById('cuit').required = false;
                    document.getElementById('razon_social').required = false;
                    
                    // Limpiar campos de empresa
                    document.getElementById('cuit').value = '';
                    document.getElementById('razon_social').value = '';
                    
                } else if (tipo === 'empresa') {
                    // Mostrar campos de empresa
                    grupoCUIT.classList.remove('hidden');
                    grupoRazonSocial.classList.remove('hidden');
                    
                    // Hacer requeridos los campos de empresa
                    document.getElementById('cuit').required = true;
                    document.getElementById('razon_social').required = true;
                }
                
                // Limpiar validaciones
                limpiarValidaciones();
            }

            function limpiarValidaciones() {
                document.querySelectorAll('.form-control').forEach(input => {
                    input.classList.remove('is-valid', 'is-invalid');
                    input.setCustomValidity('');
                });
            }

            /**
             * Extrae el DNI (8 dígitos del medio) desde un CUIT con formato XX-XXXXXXXX-X
             * @param {string} cuit - CUIT en formato XX-XXXXXXXX-X
             * @returns {string} - DNI de 8 dígitos o string vacío si no es válido
             */
            function extraerDNIDesdeCUIT(cuit) {
                if (!cuit || typeof cuit !== 'string') return '';
                
                // Remover espacios y validar formato XX-XXXXXXXX-X
                const cuitLimpio = cuit.trim().replace(/\s/g, '');
                const regexCUIT = /^\d{2}-(\d{8})-\d{1}$/;
                
                const match = cuitLimpio.match(regexCUIT);
                return match ? match[1] : ''; // Retorna los 8 dígitos del medio
            }

            /**
             * Formatea un CUIT automáticamente mientras el usuario escribe
             * @param {string} valor - Valor actual del campo CUIT
             * @returns {string} - CUIT formateado
             */
            function formatearCUIT(valor) {
                // Remover todo excepto números
                const soloNumeros = valor.replace(/[^\d]/g, '');
                
                if (soloNumeros.length <= 2) {
                    return soloNumeros;
                } else if (soloNumeros.length <= 10) {
                    return `${soloNumeros.substring(0, 2)}-${soloNumeros.substring(2)}`;
                } else {
                    return `${soloNumeros.substring(0, 2)}-${soloNumeros.substring(2, 10)}-${soloNumeros.substring(10, 11)}`;
                }
            }

            /**
             * Normaliza el DNI para enviarlo al backend
             * Si tiene 7 dígitos, agrega un 0 al principio
             * @param {string} dni - DNI ingresado por el usuario
             * @returns {string} - DNI normalizado a 8 dígitos
             */
            function normalizarDNI(dni) {
                if (!dni) return '';
                
                // Limpiar el DNI (solo números)
                const dniLimpio = dni.replace(/[^\d]/g, '');
                
                // Si tiene 7 dígitos, agregar un 0 al principio
                if (dniLimpio.length === 7) {
                    return '0' + dniLimpio;
                }
                
                // Si tiene 8 dígitos, devolver tal cual
                return dniLimpio;
            }

            function mostrarFeedbackDNI() {
                const dniInput = document.getElementById('documento');
                const cuitInput = document.getElementById('cuit');
                
                if (dniInput.value && cuitInput.value) {
                    const dniDesdeCUIT = extraerDNIDesdeCUIT(cuitInput.value);
                    
                    if (dniDesdeCUIT === dniInput.value) {
                        // Feedback visual de coincidencia
                        dniInput.classList.add('dni-extracted');
                        setTimeout(() => {
                            dniInput.classList.remove('dni-extracted');
                        }, 1000);
                    }
                }
            }

            // Función para formatear fecha de yyyy-mm-dd a dd/mm/aaaa
            function formatearFecha(fechaISO) {
                if (!fechaISO) return '';
                const fecha = new Date(fechaISO);
                const dia = fecha.getDate().toString().padStart(2, '0');
                const mes = (fecha.getMonth() + 1).toString().padStart(2, '0');
                const año = fecha.getFullYear();
                return `${dia}/${mes}/${año}`;
            }

            function mostrarMensaje(mensaje, tipo) {
                if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    successMessage.textContent = mensaje;
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            function validarFormulario() {
                const contrasenia = document.getElementById('contrasenia').value;
                const confirmarContrasenia = document.getElementById('confirmar_contrasenia').value;
                const dni = document.getElementById('documento').value;
                const tipo = tipoInput.value;
                
                // Validar DNI - 7 u 8 dígitos
                if (!/^\d{7,8}$/.test(dni)) {
                    document.getElementById('documento').setCustomValidity('El DNI debe contener 7 u 8 dígitos numéricos');
                    document.getElementById('documento').classList.add('is-invalid');
                    return false;
                } else {
                    document.getElementById('documento').setCustomValidity('');
                }

                // Validaciones específicas por tipo
                if (tipo === 'empresa') {
                    const cuit = document.getElementById('cuit').value;
                    const razonSocial = document.getElementById('razon_social').value;
                    
                    // Validar CUIT
                    if (cuit && cuit.trim() !== '') {
                        const dniDesdeCUIT = extraerDNIDesdeCUIT(cuit);
                        if (!dniDesdeCUIT) {
                            document.getElementById('cuit').setCustomValidity('Formato de CUIT inválido. Use: XX-XXXXXXXX-X');
                            document.getElementById('cuit').classList.add('is-invalid');
                            return false;
                        }
                        
                        document.getElementById('cuit').setCustomValidity('');
                    }
                    
                    // Validar Razón Social
                    if (!razonSocial || razonSocial.trim() === '') {
                        document.getElementById('razon_social').setCustomValidity('La razón social es obligatoria para empresas');
                        document.getElementById('razon_social').classList.add('is-invalid');
                        return false;
                    } else {
                        document.getElementById('razon_social').setCustomValidity('');
                    }
                }

                // Validar que las contraseñas coincidan
                if (contrasenia !== confirmarContrasenia) {
                    document.getElementById('confirmar_contrasenia').setCustomValidity('Las contraseñas no coinciden');
                    return false;
                } else {
                    document.getElementById('confirmar_contrasenia').setCustomValidity('');
                }

                // Validar campos requeridos
                let camposRequeridos = [
                    'nombre', 'apellido', 'documento', 'fecha_nacimiento', 
                    'mail', 'direccion', 'telefono', 'contrasenia', 'confirmar_contrasenia'
                ];

                // Agregar campos específicos por tipo
                if (tipo === 'empresa') {
                    camposRequeridos.push('cuit', 'razon_social');
                }

                let esValido = true;
                camposRequeridos.forEach(campo => {
                    const elemento = document.getElementById(campo);
                    if (elemento && !elemento.checkValidity()) {
                        elemento.classList.add('is-invalid');
                        esValido = false;
                    } else if (elemento) {
                        elemento.classList.remove('is-invalid');
                        elemento.classList.add('is-valid');
                    }
                });

                return esValido;
            }

            // Event listener para el formulario
            formulario.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!validarFormulario()) {
                    mostrarMensaje('Por favor corrija los errores en el formulario', 'error');
                    return;
                }

                btnRegistrar.disabled = true;
                btnRegistrar.innerHTML = '<span class="loading-spinner"></span> Registrando...';

                try {
                    const formData = new FormData(formulario);
                    const tipo = tipoInput.value;
                    
                    // Normalizar el DNI antes de enviarlo
                    const dniNormalizado = normalizarDNI(formData.get('documento'));
                    
                    // Crear objeto con la estructura exacta que espera la entidad Cliente
                    const clienteData = {
                        activo: true, // SIEMPRE true
                        apellido: formData.get('apellido').trim(),
                        contrasenia: formData.get('contrasenia'),
                        // CUIT se envía exactamente igual que en cliente - sin modificar
                        cuit: formData.get('cuit') ? formData.get('cuit').trim() : null,
                        direccion: formData.get('direccion').trim(),
                        documento: dniNormalizado, // DNI normalizado a 8 dígitos
                        fecha_nacimiento: formatearFecha(formData.get('fecha_nacimiento')), // Formato dd/mm/aaaa
                        legajo: "", // Campo requerido pero puede estar vacío
                        mail: formData.get('mail').trim(),
                        nombre: formData.get('nombre').trim(),
                        telefono: formData.get('telefono').trim(),
                        tipo: tipo // "cliente" o "empresa"
                    };

                    // Para empresas, agregar razón social si existe
                    if (tipo === 'empresa' && formData.get('razon_social')) {
                        clienteData.razon_social = formData.get('razon_social').trim();
                    }

                    console.log('Enviando datos:', clienteData);
                    console.log('Endpoint:', API_BASE_URL + API_ENDPOINT);

                    // Enviar petición al endpoint
                    const response = await fetch(API_BASE_URL + API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(clienteData)
                    });

                    const resultado = await response.json();
                    console.log('Respuesta del servidor:', resultado);

                    if (response.ok) {
                        mostrarMensaje('¡REGISTRADO CON ÉXITO!', 'success');
                        formulario.reset();
                        
                        // Redirigir al home después de 3 segundos
                        setTimeout(() => {
                            window.location.href = '/inicio';
                        }, 3000);
                    } else {
                        // Mostrar error específico del servidor
                        if (resultado.descripcion) {
                            mostrarMensaje(resultado.descripcion, 'error');
                        } else if (resultado.data) {
                            mostrarMensaje(resultado.data, 'error');
                        } else {
                            mostrarMensaje('Error al crear la cuenta. Intente nuevamente.', 'error');
                        }
                    }

                } catch (error) {
                    console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Verifique su internet e intente nuevamente.', 'error');
                } finally {
                    btnRegistrar.disabled = false;
                    btnRegistrar.textContent = 'Registrarte';
                }
            });

            // Auto-completar DNI desde CUIT (para empresas)
            document.getElementById('cuit').addEventListener('input', function(e) {
                const cuitInput = e.target;
                const dniInput = document.getElementById('documento');
                const tipo = tipoInput.value;
                
                // Formatear CUIT automáticamente
                const cursorPosition = cuitInput.selectionStart;
                const valorFormateado = formatearCUIT(cuitInput.value);
                cuitInput.value = valorFormateado;
                
                // Restaurar posición del cursor
                const cambios = valorFormateado.length - cuitInput.value.length;
                cuitInput.setSelectionRange(cursorPosition + cambios, cursorPosition + cambios);
                
                // Extraer DNI solo si es empresa y el campo DNI está vacío o contiene solo el valor del CUIT anterior
                if (tipo === 'empresa') {
                    const dniDesdeCUIT = extraerDNIDesdeCUIT(valorFormateado);
                    
                    if (dniDesdeCUIT && (!dniInput.value || dniInput.value === this.ultimoDNIExtraido)) {
                        dniInput.value = dniDesdeCUIT;
                        this.ultimoDNIExtraido = dniDesdeCUIT; // Guardar referencia
                        
                        // Disparar eventos de validación
                        dniInput.dispatchEvent(new Event('input', { bubbles: true }));
                        dniInput.dispatchEvent(new Event('blur', { bubbles: true }));
                    }
                }
            });

            // Validación específica para CUIT
            document.getElementById('cuit').addEventListener('blur', function() {
                const cuit = this.value.trim();
                const tipo = tipoInput.value;
                
                if (cuit && cuit !== '' && tipo === 'empresa') {
                    const dniExtraido = extraerDNIDesdeCUIT(cuit);
                    
                    if (!dniExtraido) {
                        this.classList.add('is-invalid');
                        this.setCustomValidity('Formato de CUIT inválido. Use: XX-XXXXXXXX-X');
                    } else {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                        this.setCustomValidity('');
                    }
                } else {
                    this.classList.remove('is-invalid', 'is-valid');
                    this.setCustomValidity('');
                }
            });

            // Validación en tiempo real para DNI
            document.getElementById('documento').addEventListener('input', function() {
                const dni = this.value;
                if (/^\d{7,8}$/.test(dni)) {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                    this.setCustomValidity('');
                } else {
                    this.classList.remove('is-valid');
                    if (dni.length > 0) {
                        this.classList.add('is-invalid');
                    }
                }
            });

            // Validaciones en tiempo real para el resto de campos
            const camposValidacion = document.querySelectorAll('#formulario-registro input');
            camposValidacion.forEach(campo => {
                campo.addEventListener('blur', function() {
                    if (this.checkValidity()) {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                    } else {
                        this.classList.remove('is-valid');
                        this.classList.add('is-invalid');
                    }
                });

                // Limpiar validación visual al escribir
                campo.addEventListener('input', function() {
                    if (this.classList.contains('is-invalid')) {
                        this.classList.remove('is-invalid');
                    }
                    if (this.classList.contains('is-valid')) {
                        this.classList.remove('is-valid');
                    }
                });
            });

            // Validación especial: Confirmar contraseña
            document.getElementById('confirmar_contrasenia').addEventListener('input', function() {
                const contrasenia = document.getElementById('contrasenia').value;
                const confirmar = this.value;
                
                if (confirmar && contrasenia !== confirmar) {
                    this.setCustomValidity('Las contraseñas no coinciden');
                    this.classList.add('is-invalid');
                } else {
                    this.setCustomValidity('');
                    this.classList.remove('is-invalid');
                    if (confirmar && contrasenia === confirmar) {
                        this.classList.add('is-valid');
                    }
                }
            });

            // Inicializar con campos de cliente individual
            actualizarCamposPorTipo('cliente');
        });
    </script>
</body>
</html>
