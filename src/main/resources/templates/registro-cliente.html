<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear una cuenta - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #8B4513;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid #DAA520;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #DAA520;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
        }
        
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .header-title {
            color: #333;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            flex-grow: 1;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-item {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-item:hover {
            background-color: rgba(218, 165, 32, 0.2);
            color: #8B4513;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            border: 2px solid #DAA520;
            color: #8B4513;
            font-weight: bold;
        }
        
        /* Main Content */
        .main-content {
            background-color: #8B4513;
            min-height: calc(100vh - 80px);
            padding: 2rem;
            padding-top: 110px;
        }
        
        .form-container {
            max-width: 1000px;
            margin: 0 auto;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            border: 2px solid #DAA520;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .form-container h2 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .form-label {
            color: #8B4513;
            font-weight: 600;
            min-width: 120px;
            text-align: right;
        }
        
        .form-control {
            background-color: white;
            border: 2px solid #DAA520;
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1rem;
            color: #333;
            flex-grow: 1;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }
        
        .form-control::placeholder {
            color: #999;
        }
        
        /* Success Message */
        .success-message {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(218, 165, 32, 0.5);
            display: none;
            border: 3px solid #FFD700;
            position: relative;
            overflow: hidden;
        }
        
        .success-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shine 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin: 1rem 0;
            display: none;
        }
        
        /* Buttons */
        .btn-register {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border: 2px solid #DAA520;
            padding: 1rem 3rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto;
        }
        
        .btn-register:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4);
        }
        
        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Back Button */
        .btn-back {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-back:hover {
            background: linear-gradient(135deg, #A0522D 0%, #8B4513 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .form-group {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            
            .form-label {
                text-align: left;
                min-width: auto;
            }
            
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }
            
            .header-title {
                font-size: 1.5rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .form-container {
                padding: 1.5rem;
            }
        }
        
        /* Validation Styles */
        .form-control.is-valid {
            border-color: #28a745;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
        }
        
        .invalid-feedback {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-circle">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">
            </div>
        </div>
        <h1 class="header-title">Crear una cuenta</h1>
        <div></div> <!-- Spacer -->
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <div class="form-container">
            <!-- Success Message -->
            <div id="success-message" class="success-message">
                ¡REGISTRADO CON ÉXITO!
          </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message">
                <!-- Error messages will be inserted here -->
          </div>

            <!-- Back Button -->
            <a th:href="@{/inicio}" class="btn-back">
                <i class="bi bi-arrow-left"></i>
                Volver al inicio
            </a>
            
            <!-- Registration Form -->
              <form id="formulario-registro" novalidate>
                <div class="form-row">
                    <!-- Left Column -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required
                                   placeholder="Ingrese su nombre">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="documento" class="form-label">DNI</label>
                            <input type="text" class="form-control" id="documento" name="documento" required
                                   placeholder="Ej: 12345678" maxlength="15">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="mail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="mail" name="mail" required
                                   placeholder="ejemplo@email.com">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" required>
                            <div class="invalid-feedback"></div>
                  </div>
                    </div>
                    
                    <!-- Right Column -->
                    <div class="form-column">
                        <div class="form-group">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" required
                                   placeholder="Ingrese su apellido">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion" required
                                   placeholder="Calle, número, ciudad">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" required
                                   placeholder="Ej: 1123456789" maxlength="15">
                            <div class="invalid-feedback"></div>
                  </div>

                        <div class="form-group">
                            <label for="cuit" class="form-label">Cuit</label>
                    <input type="text" class="form-control" id="cuit" name="cuit"
                                   placeholder="Ej: 20-12345678-9">
                            <div class="invalid-feedback"></div>
                        </div>
                    </div>
                  </div>

                <!-- Password Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="contrasenia" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="contrasenia" name="contrasenia" required
                               placeholder="Mínimo 6 caracteres" minlength="6">
                        <div class="invalid-feedback"></div>
                  </div>

                    <div class="form-group">
                        <label for="confirmar_contrasenia" class="form-label">Confirmar contraseña</label>
                      <input type="password" class="form-control" id="confirmar_contrasenia" required
                               placeholder="Repita su contraseña">
                        <div class="invalid-feedback"></div>
                  </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-register" id="btn-registrar">
                    Registrarte
                    </button>
              </form>
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const formulario = document.getElementById('formulario-registro');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
    const btnRegistrar = document.getElementById('btn-registrar');

            // Función para mostrar mensajes
    function mostrarMensaje(mensaje, tipo) {
        if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            // Función para validar formulario
    function validarFormulario() {
        const contrasenia = document.getElementById('contrasenia').value;
        const confirmarContrasenia = document.getElementById('confirmar_contrasenia').value;
        
        // Validar que las contraseñas coincidan
        if (contrasenia !== confirmarContrasenia) {
            document.getElementById('confirmar_contrasenia').setCustomValidity('Las contraseñas no coinciden');
            return false;
        } else {
            document.getElementById('confirmar_contrasenia').setCustomValidity('');
        }

        // Validar campos requeridos
        const camposRequeridos = [
            'nombre', 'apellido', 'documento', 'fecha_nacimiento', 
            'mail', 'direccion', 'telefono', 'contrasenia', 'confirmar_contrasenia'
        ];

        let esValido = true;
        camposRequeridos.forEach(campo => {
            const elemento = document.getElementById(campo);
            if (!elemento.checkValidity()) {
                elemento.classList.add('is-invalid');
                esValido = false;
            } else {
                elemento.classList.remove('is-invalid');
                        elemento.classList.add('is-valid');
            }
        });

        return esValido;
    }

            // Event listener para el formulario
    formulario.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Validar formulario antes de enviar
        if (!validarFormulario()) {
                    mostrarMensaje('Por favor corrija los errores en el formulario', 'error');
            return;
        }

        // Deshabilitar botón para evitar envíos múltiples
        btnRegistrar.disabled = true;
                btnRegistrar.textContent = 'Registrando...';

        try {
            // Preparar datos del formulario
            const formData = new FormData(formulario);
            const clienteData = {
                nombre: formData.get('nombre'),
                apellido: formData.get('apellido'),
                documento: formData.get('documento'),
                fecha_nacimiento: formData.get('fecha_nacimiento'),
                mail: formData.get('mail'),
                direccion: formData.get('direccion'),
                telefono: formData.get('telefono'),
                cuit: formData.get('cuit') || null,
                contrasenia: formData.get('contrasenia')
            };

            // Enviar petición al backend
            const response = await fetch('/registrarCliente', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(clienteData)
            });

            const resultado = await response.json();

            if (response.ok) {
                // CREACIÓN DE CUENTA EXITOSA
                        mostrarMensaje('', 'success');
                formulario.reset();
                
                        // Mostrar mensaje de éxito más prominente
                        successMessage.style.display = 'block';
                        successMessage.style.animation = 'pulse 0.5s ease-in-out';
                        successMessage.innerHTML = '¡REGISTRADO CON ÉXITO!';
                        
                        // Scroll hacia el mensaje de éxito
                        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // Redirigir al home después de 4 segundos
                setTimeout(() => {
                            window.location.href = '/inicio';
                        }, 4000);
                } else {
                    // ERROR EN LA CREACIÓN DE CUENTA
                    if (response.status === 409) {
                        // Conflicto: DNI o email ya existe
                            mostrarMensaje(resultado.data || resultado.descripcion, 'error');
                    } else {
                        // Otros errores
                            mostrarMensaje(resultado.data || 'Error al crear la cuenta. Intente nuevamente.', 'error');
                        }
                }

        } catch (error) {
            // ERROR DE CONEXIÓN
            console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Verifique su internet e intente nuevamente.', 'error');
        } finally {
            // Rehabilitar botón
            btnRegistrar.disabled = false;
                    btnRegistrar.textContent = 'Registrarte';
        }
    });

            // Validaciones en tiempo real
    const camposValidacion = document.querySelectorAll('#formulario-registro input');
    camposValidacion.forEach(campo => {
        campo.addEventListener('blur', function() {
            if (this.checkValidity()) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
            } else {
                this.classList.remove('is-valid');
                this.classList.add('is-invalid');
            }
        });

        // Limpiar validación visual al escribir
        campo.addEventListener('input', function() {
            if (this.classList.contains('is-invalid')) {
                this.classList.remove('is-invalid');
            }
            if (this.classList.contains('is-valid')) {
                this.classList.remove('is-valid');
            }
        });
    });

            // Validación especial: Confirmar contraseña
    document.getElementById('confirmar_contrasenia').addEventListener('input', function() {
        const contrasenia = document.getElementById('contrasenia').value;
        const confirmar = this.value;
        
        if (confirmar && contrasenia !== confirmar) {
            this.setCustomValidity('Las contraseñas no coinciden');
            this.classList.add('is-invalid');
        } else {
            this.setCustomValidity('');
            this.classList.remove('is-invalid');
            if (confirmar && contrasenia === confirmar) {
                this.classList.add('is-valid');
            }
        }
    });
});
</script>
</body>
</html>
