<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
<section th:fragment="content">

    <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="m-0">Sueldos Básicos</h2>
            <div>
                <button class="btn btn-outline-primary me-2"
                        hx-get="/sueldos-basicos/list"
                        hx-target="#sueldos-basicos-list"
                        hx-swap="innerHTML">
                    Cargar
                </button>

                <button class="btn btn-success"
                        hx-get="/sueldos-basicos/form"
                        hx-target="#sueldos-basicos-form"
                        hx-swap="innerHTML">
                    Nuevo
                </button>
            </div>
        </div>
    </div>

    <!-- Lista -->
    <div id="sueldos-basicos-list"></div>

    <!-- Formulario -->
    <div id="sueldos-basicos-form" class="mt-3"></div>


    <!-- =============================
          SCRIPT EDITAR / ACTUALIZAR
       ============================== -->
    <script>
        // Cargar lista al iniciar
        document.addEventListener('DOMContentLoaded', function () {
            htmx.ajax('GET', '/sueldos-basicos/list', '#sueldos-basicos-list');
        });

        // ----- EDITAR -----
        function editarSueldo(id) {

            // 1) Cargar formulario vacío
            fetch('/sueldos-basicos/form')
                .then(response => response.text())
                .then(html => {

                    document.querySelector('#sueldos-basicos-form').innerHTML = html;

                    // 2) Cargar datos del sueldo
                    return fetch(`/sueldos-basicos/${id}`);
                })
                .then(response => response.json())
                .then(resp => {

                    const sueldo = resp.data; // backend devuelve {data: {...}}

                    // 3) Cargar valores en los inputs
                    document.querySelector('#id').value = sueldo.id;
                    document.querySelector('#categoriaId').value = sueldo.categoria.id;
                    document.querySelector('#porcentajeMesId').value = sueldo.porcentajeMes.id;
                    document.querySelector('#sueldoBasico').value = sueldo.sueldo_basico;

                    // Cambiar título
                    const titulo = document.querySelector('#titulo-form');
                    if (titulo) titulo.textContent = "Editar Sueldo Básico";

                    // Cambiar acción del botón guardar
                    const btn = document.querySelector('#btn-guardar');
                    if (btn) btn.onclick = function () {
                        actualizarSueldo();
                    };
                })
                .catch(err => console.error("Error al editar:", err));
        }

        // ----- ACTUALIZAR -----
        function actualizarSueldo() {

            const payload = {
                id: document.querySelector('#id').value,
                categoriaId: document.querySelector('#categoriaId').value,
                porcentajeMesId: document.querySelector('#porcentajeMesId').value,
                sueldoBasico: document.querySelector('#sueldoBasico').value
            };

            fetch('/updateSueldoBasico', {
                method: 'PUT',
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
                .then(r => r.json())
                .then(resp => {
                    alert("Sueldo Básico actualizado correctamente");
                    htmx.ajax('GET', '/sueldos-basicos/list', '#sueldos-basicos-list');
                })
                .catch(err => console.error("Error al actualizar:", err));
        }
    </script>

</section>
</html>
