<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Asistencia Total</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/asistencias-total/list" hx-target="#asistencias-total-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/asistencias-total/form" hx-target="#asistencias-total-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

  <div id="asistencias-total-list"></div>
  <div id="asistencias-total-form" class="mt-3"></div>
    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/asistencias-total/list','#asistencias-total-list'); });</script>
  </section>
</html>
