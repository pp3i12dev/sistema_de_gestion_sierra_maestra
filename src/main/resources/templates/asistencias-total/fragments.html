<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <div th:fragment="lista">
    <div th:if="${#lists.isEmpty(items)}">No hay registros de asistencia total.</div>
    <div th:each="a : ${items}" class="card mb-2 p-2">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${a.id}">ID</strong>
          <div class="muted" th:text="${a.descripcion}">Descripcion</div>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/asistencias-total/save}" th:object="${asistenciaTotal}" hx-post="/asistencias-total/save" hx-target="#asistencias-total-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="mb-2">
        <label>Descripción</label>
        <input class="form-control" th:field="*{descripcion}" />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" onclick="htmx.ajax('GET','/asistencias-total/list','#asistencias-total-list')">Cancelar</button>
      </div>
    </form>
  </div>
</html>
