<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #D2691E 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .inicio-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem 2.5rem;
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #DAA520;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.3);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .logo-section h1 {
            color: #333;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .logo-section p {
            color: #6c757d;
            font-size: 1rem;
        }
        
        .opciones-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .opcion-card {
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 2rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: #f8f9fa;
        }
        
        .opcion-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #DAA520;
        }
        
        .opcion-usuario:hover {
            background: linear-gradient(135deg, #8B451315 0%, #A0522D15 100%);
        }
        
        .opcion-cliente:hover {
            background: linear-gradient(135deg, #DAA52015 0%, #FFD70015 100%);
        }
        
        .opcion-icon {
            font-size: 3rem;
            min-width: 60px;
            text-align: center;
        }
        
        .opcion-usuario .opcion-icon {
            color: #8B4513;
        }
        
        .opcion-cliente .opcion-icon {
            color: #DAA520;
        }
        
        .opcion-content h3 {
            margin: 0 0 0.5rem 0;
            color: #333;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .opcion-content p {
            margin: 0;
            color: #6c757d;
            font-size: 0.95rem;
        }
        
        .arrow-icon {
            margin-left: auto;
            font-size: 1.5rem;
            color: #DAA520;
        }
        
        @media (max-width: 576px) {
            .inicio-container {
                padding: 2rem 1.5rem;
            }
            
            .logo-section h1 {
                font-size: 1.5rem;
            }
            
            .opcion-card {
                padding: 1.5rem;
                gap: 1rem;
            }
            
            .opcion-icon {
                font-size: 2.5rem;
                min-width: 50px;
            }
            
            .opcion-content h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="inicio-container">
        <!-- Logo y título -->
        <div class="logo-section">
            <div class="logo">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">
            </div>
            <h1>Sistema Sierra Maestra</h1>
            <p>Bienvenido, por favor seleccione su tipo de acceso</p>
        </div>
        
        <!-- Opciones de acceso -->
        <div class="opciones-container">
            <!-- Opción Usuario/Administrador -->
            <a th:href="@{/home}" class="opcion-card opcion-usuario">
                <div class="opcion-icon">
                    <i class="bi bi-person-gear"></i>
                </div>
                <div class="opcion-content">
                    <h3>Soy Usuario</h3>
                    <p>Acceso al sistema de gestión administrativa</p>
                </div>
                <div class="arrow-icon">
                    <i class="bi bi-arrow-right-circle"></i>
                </div>
            </a>
            
            <!-- Opción Cliente -->
            <a th:href="@{/cliente-dashboard}" class="opcion-card opcion-cliente">
                <div class="opcion-icon">
                    <i class="bi bi-cart-check"></i>
                </div>
                <div class="opcion-content">
                    <h3>Soy Cliente</h3>
                    <p>Realizar pedidos y consultar productos</p>
                </div>
                <div class="arrow-icon">
                    <i class="bi bi-arrow-right-circle"></i>
                </div>
            </a>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
