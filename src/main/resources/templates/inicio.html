    <script>
    // Configuración de API
    const API = 'http://localhost:8080';

    // Función para procesar la respuesta del servidor
    function procesarRespuestaServidor(data, endpoint) {
        console.log(`Respuesta cruda de ${endpoint}:`, data);
        
        // Si ya es un array, devolverlo directamente
        if (Array.isArray(data)) {
            return data;
        }
        
        // Si es un objeto, buscar arrays dentro de él
        if (typeof data === 'object' && data !== null) {
            // Buscar cualquier propiedad que sea un array
            for (let key in data) {
                if (Array.isArray(data[key])) {
                    console.log(`Encontrado array en propiedad "${key}"`);
                    return data[key];
                }
            }
            
            // Si no hay arrays, intentar convertir el objeto en array
            if (Object.keys(data).length > 0) {
                console.log('Convirtiendo objeto a array');
                return [data];
            }
        }
        
        // Si es un string, intentar parsear como JSON
        if (typeof data === 'string') {
            try {
                const parsed = JSON.parse(data);
                return procesarRespuestaServidor(parsed, endpoint);
            } catch (e) {
                console.warn('No se pudo parsear la respuesta como JSON:', e);
            }
        }
        
        throw new Error(`Formato de respuesta no reconocido para ${endpoint}`);
    }

        clientes.forEach((cliente, index) => {
            const coincideEmail = cliente.mail === email;
            const coincidePassword = cliente.contrasenia === password;
            // Usar activo === true en lugar de activo === 1
            const estaActivo = cliente.activo === true;
            
            console.log(`Cliente ${index + 1}:`, {
                id: cliente.id,
                mail: cliente.mail,
                contrasenia: cliente.contrasenia,
                activo: cliente.activo,
                tipoActivo: typeof cliente.activo,
                nombre: cliente.nombre || 'No disponible',
                coincideEmail: coincideEmail,
                coincidePassword: coincidePassword,
                estaActivo: estaActivo,
                ES_VALIDO: (coincideEmail && coincidePassword && estaActivo) ? '✅ SÍ' : '❌ NO'
            });
        });
        
        // Buscar con activo === true
        const clienteExacto = clientes.find(c => 
            c.mail === email && 
            c.contrasenia === password &&
            c.activo === true
        );
        
        console.log('🎯 RESULTADO DE BÚSQUEDA EXACTA:', clienteExacto);
        
        if (!clienteExacto) {
            console.log('🔎 DIAGNÓSTICO DEL PROBLEMA:');
            
            const clientePorEmail = clientes.find(c => c.mail === email);
            if (clientePorEmail) {
                console.log('✅ Se encontró cliente con el email:', clientePorEmail);
                console.log('   - ¿Coincide la contraseña?:', clientePorEmail.contrasenia === password ? '✅ SÍ' : '❌ NO');
                console.log('   - ¿Está activo?:', clientePorEmail.activo === true ? '✅ SÍ' : '❌ NO');
                console.log('   - Tipo de dato de activo:', typeof clientePorEmail.activo);
                console.log('   - Valor de activo:', clientePorEmail.activo);
                
                if (clientePorEmail.contrasenia !== password) {
                    console.log('   - Contraseña en BD:', `"${clientePorEmail.contrasenia}"`);
                    console.log('   - Contraseña ingresada:', `"${password}"`);
                    console.log('   - ¿Son iguales?:', clientePorEmail.contrasenia === password ? 'SÍ' : 'NO');
                }
            } else {
                console.log('❌ NO se encontró ningún cliente con ese email');
                console.log('Emails disponibles:', clientes.map(c => c.mail));
            }
        }
        
        return clienteExacto;
    }

    function init() {
        // ===== LOGIN CLIENTE =====
        const modalCliente = document.getElementById('login-modal-cliente');
        const btnOpcionCliente = document.getElementById('opcion-cliente');
        const closeModalCliente = document.getElementById('close-modal-cliente');
        const loginFormCliente = document.getElementById('login-form-cliente');
        const successMessageCliente = document.getElementById('success-message-cliente');
        const errorMessageCliente = document.getElementById('error-message-cliente');
        const btnLoginCliente = document.getElementById('btn-login-cliente');

        // ===== LOGIN ASOCIADO/USUARIO =====
        const modalUsuario = document.getElementById('login-modal');
        const btnOpcionUsuario = document.getElementById('opcion-usuario');
        const closeModalUsuario = document.getElementById('close-modal');
        const loginFormUsuario = document.getElementById('login-form');
        const successMessageUsuario = document.getElementById('success-message');
        const errorMessageUsuario = document.getElementById('error-message');
        const btnLoginUsuario = document.getElementById('btn-login');

        // ===== FORGOT PASSWORD =====
        const forgotModal = document.getElementById("forgot-password-modal");
        const forgotLink = document.getElementById("forgot-password-link");
        const closeForgot = document.getElementById("close-forgot-password");
        const forgotForm = document.getElementById("forgot-password-form");
        const successForgot = document.getElementById("success-message-forgot");
        const errorForgot = document.getElementById("error-message-forgot");

        // Mostrar modal cliente
        if (btnOpcionCliente && modalCliente) {
            btnOpcionCliente.addEventListener('click', function() {
                modalCliente.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                if (loginFormCliente) loginFormCliente.reset();
                if (errorMessageCliente) errorMessageCliente.style.display = 'none';
                if (successMessageCliente) successMessageCliente.style.display = 'none';
            });
        }

        // Cerrar modal cliente
        if (closeModalCliente && modalCliente) {
            closeModalCliente.addEventListener('click', function() {
                modalCliente.style.display = 'none';
                document.body.style.overflow = 'auto';
            });
        }

        // Cerrar modal al hacer clic fuera (cliente)
        if (modalCliente) {
            modalCliente.addEventListener('click', function(e) {
                if (e.target === modalCliente) {
                    modalCliente.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
        }

        // Mostrar modal usuario
        if (btnOpcionUsuario && modalUsuario) {
            btnOpcionUsuario.addEventListener('click', function() {
                modalUsuario.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                if (loginFormUsuario) loginFormUsuario.reset();
                if (errorMessageUsuario) errorMessageUsuario.style.display = 'none';
                if (successMessageUsuario) successMessageUsuario.style.display = 'none';
            });
        }

        // Cerrar modal usuario
        if (closeModalUsuario && modalUsuario) {
            closeModalUsuario.addEventListener('click', function() {
                modalUsuario.style.display = 'none';
                document.body.style.overflow = 'auto';
            });
        }

        // Cerrar modal al hacer clic fuera (usuario)
        if (modalUsuario) {
            modalUsuario.addEventListener('click', function(e) {
                if (e.target === modalUsuario) {
                    modalUsuario.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
        }

        // Función para mostrar mensajes cliente
        function mostrarMensajeCliente(mensaje, tipo) {
            if (!errorMessageCliente || !successMessageCliente) return;
            
            if (tipo === 'success') {
                successMessageCliente.style.display = 'block';
                successMessageCliente.textContent = mensaje;
                errorMessageCliente.style.display = 'none';
            } else {
                errorMessageCliente.style.display = 'block';
                errorMessageCliente.textContent = mensaje;
                successMessageCliente.style.display = 'none';
            }
        }

        // Función para mostrar mensajes usuario
        function mostrarMensajeUsuario(mensaje, tipo) {
            if (!errorMessageUsuario || !successMessageUsuario) return;
            
            if (tipo === 'success') {
                successMessageUsuario.style.display = 'block';
                successMessageUsuario.textContent = mensaje;
                errorMessageUsuario.style.display = 'none';
            } else {
                errorMessageUsuario.style.display = 'block';
                errorMessageUsuario.textContent = mensaje;
                successMessageUsuario.style.display = 'none';
            }
        }

        // Manejo del formulario de login de cliente
        if (loginFormCliente && btnLoginCliente) {
            loginFormCliente.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email-cliente')?.value;
                const password = document.getElementById('password-cliente')?.value;

                if (!email || !password) {
                    mostrarMensajeCliente('Por favor complete todos los campos', 'error');
                    return;
                }

                btnLoginCliente.disabled = true;
                btnLoginCliente.textContent = 'Iniciando...';

                try {
                    console.log('🔄 Obteniendo clientes del servidor...');
                    
                    const response = await fetch(`${API}/getAllCliente`);
                    if (!response.ok) throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                    
                    const data = await response.json();
                    console.log('✅ Clientes obtenidos correctamente');
                    
                    const clientes = procesarRespuestaServidor(data, 'getAllCliente');
                    console.log(`📊 ${clientes.length} clientes procesados`);
                    
                    const cliente = debugBusquedaCliente(clientes, email, password);
                    
                    if (cliente) {
                        console.log('✅ Cliente encontrado y activo:', cliente);
                        mostrarMensajeCliente('¡Inicio de sesión exitoso!', 'success');
                        
                        sessionStorage.setItem('clienteLogueado', JSON.stringify({
                            id: cliente.id,
                            email: cliente.mail,
                            nombre: cliente.nombre,
                            telefono: cliente.telefono
                        }));
                        
                        setTimeout(() => {
                            window.location.href = '/pedidos-clientes/';
                        }, 1500);
                    } else {
                        console.log('❌ No se encontró cliente con esas credenciales exactas');
                        mostrarMensajeCliente('Email o contraseña incorrectos', 'error');
                    }
                } catch (error) {
                    console.error('❌ Error en el proceso de login:', error);
                    mostrarMensajeCliente('Error de conexión. Intente nuevamente.', 'error');
                } finally {
                    btnLoginCliente.disabled = false;
                    btnLoginCliente.textContent = 'Iniciar sesión';
                }
            });
        }

        // Manejo del formulario de login de usuario/asociado
        if (loginFormUsuario && btnLoginUsuario) {
            loginFormUsuario.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const legajo = document.getElementById('legajo')?.value;
                const password = document.getElementById('password')?.value;

                if (!legajo || !password) {
                    mostrarMensajeUsuario('Por favor complete todos los campos', 'error');
                    return;
                }

                btnLoginUsuario.disabled = true;
                btnLoginUsuario.textContent = 'Iniciando...';

                try {
                    console.log('🔄 Obteniendo asociados del servidor...');
                    
                    const response = await fetch(`${API}/getAllAsociados`);
                    if (!response.ok) throw new Error(`Error HTTP: ${response.status} ${response.statusText}`);
                    
                    const data = await response.json();
                    console.log('✅ Asociados obtenidos correctamente');
                    
                    const asociados = procesarRespuestaServidor(data, 'getAllAsociados');
                    console.log(`📊 ${asociados.length} asociados procesados`);
                    
                    console.log('🔍 ESTRUCTURA DE ASOCIADOS:');
                    if (asociados.length > 0) {
                        console.log('Campos del primer asociado:', Object.keys(asociados[0]));
                        asociados.forEach((asoc, index) => {
                            console.log(`Asociado ${index + 1}:`, {
                                legajo: asoc.legajo,
                                contrasenia: asoc.contrasenia,
                                activo: asoc.activo,
                                nombre: asoc.nombre
                            });
                        });
                    }
                    
                    const asociado = asociados.find(a => {
                        const contraseniaCorrecta = a.contrasenia;
                        const estaActivo = a.activo === true || a.activo === 1;
                        
                        const coincide = a.legajo == legajo && 
                                       contraseniaCorrecta === password && 
                                       estaActivo;
                        
                        if (a.legajo == legajo) {
                            console.log('🔍 Asociado encontrado con ese legajo:', {
                                legajoBD: a.legajo,
                                legajoInput: legajo,
                                contraseniaBD: contraseniaCorrecta,
                                contraseniaInput: password,
                                coincideContrasenia: contraseniaCorrecta === password,
                                activoBD: a.activo,
                                estaActivo: estaActivo,
                                coincideTodo: coincide
                            });
                        }
                        
                        return coincide;
                    });

                    if (asociado) {
                        console.log('✅ LOGIN EXITOSO - Asociado encontrado:', asociado);
                        mostrarMensajeUsuario('¡Inicio de sesión exitoso!', 'success');
                        
                        sessionStorage.setItem('usuarioLogueado', JSON.stringify({
                            legajo: asociado.legajo,
                            nombre: asociado.nombre,
                            rol: asociado.rol
                        }));
                        
                        setTimeout(() => {
                            window.location.href = '/pedidos/';
                        }, 1500);
                    } else {
                        console.log('❌ LOGIN FALLIDO - No se encontró asociado con esas credenciales');
                        console.log('🔍 Legajos disponibles:', asociados.map(a => a.legajo));
                        mostrarMensajeUsuario('Legajo o contraseña incorrectos', 'error');
                    }
                } catch (error) {
                    console.error('❌ Error en el proceso de login:', error);
                    mostrarMensajeUsuario('Error de conexión. Intente nuevamente.', 'error');
                } finally {
                    btnLoginUsuario.disabled = false;
                    btnLoginUsuario.textContent = 'Iniciar sesión';
                }
            });
        }

        // Abrir modal "Olvidaste tu contraseña"
        if (forgotLink && forgotModal) {
            forgotLink.addEventListener("click", function(e) {
              e.preventDefault();
              forgotModal.style.display = "flex";
              document.body.style.overflow = "hidden";
              if (forgotForm) forgotForm.reset();
              if (successForgot) successForgot.style.display = "none";
              if (errorForgot) errorForgot.style.display = "none";
            });
        }

        // Cerrar modal "Olvidaste tu contraseña"
        if (closeForgot && forgotModal) {
            closeForgot.addEventListener("click", function() {
              forgotModal.style.display = "none";
              document.body.style.overflow = "auto";
            });
        }

        // Cerrar al hacer clic fuera del modal
        if (forgotModal) {
            forgotModal.addEventListener("click", function(e) {
              if (e.target === forgotModal) {
                forgotModal.style.display = "none";
                document.body.style.overflow = "auto";
              }
            });
        }

        // Enviar formulario de recuperar contraseña
        if (forgotForm) {
            forgotForm.addEventListener("submit", async function(e) {
              e.preventDefault();
              const email = document.getElementById("forgot-email").value;

              try {
                const response = await fetch(`${API}/clientes/forgot-password`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                  if (successForgot) {
                    successForgot.style.display = "block";
                    successForgot.textContent = "¡Se envió un correo con instrucciones!";
                  }
                  if (errorForgot) errorForgot.style.display = "none";
                } else {
                  const data = await response.json().catch(() => ({}));
                  if (errorForgot) {
                    errorForgot.innerText = data.mensaje || "Error al enviar correo. Revisa el email ingresado.";
                    errorForgot.style.display = "block";
                  }
                  if (successForgot) successForgot.style.display = "none";
                }
              } catch (err) {
                if (errorForgot) {
                  errorForgot.innerText = "Error de conexión con el servidor";
                  errorForgot.style.display = "block";
                }
                if (successForgot) successForgot.style.display = "none";
              }
            });
        }
    }

    // Inicializar cuando el DOM esté listo
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
