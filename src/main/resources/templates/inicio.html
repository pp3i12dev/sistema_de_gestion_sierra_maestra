        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

                /* Login Modal */


         #login-modal-cliente {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .login-modal-cliente {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 500px;
        }

        .close-modal-cliente {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-header-cliente {
            text-align: center;
        }

        .modal-title-cliente {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-message-cliente {
            color: #f00;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .modal-form-cliente {
            margin-top: 20px;
        }

        .form-group-cliente {
            margin-bottom: 20px;
        }

        .form-label-cliente {
            display: block;
            margin-bottom: 10px;

        .form-control-cliente {
            width: 100%;
            height: 40px;
            padding: 10px;

            border-radius: 5px;

                /* Buttons */
        .btn-come-back {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border: 2px solid #DAA520;
            padding: 1rem 3rem;
            border-radius: 25px;    
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto;
        }
        
        .btn-btn-come-back {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);

        .modal-overlay {

            top: 0;
            left: 0;

            justify-content: center;
            align-items: center;

        .login-modal {

            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        .modal-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .modal-title {
            color: #8B4513;
            font-size: 2rem;
            font-weight: bold;

        .form-group {
            display: flex;
            align-items: center;

        .form-label {
            color: #8B4513;
            font-weight: 600;
            min-width: 100px;
        }
        
        .form-control {
            background-color: white;
            border: 2px solid #8B4513;

            padding: 0.8rem;
            font-size: 1rem;
            color: #333;
            flex-grow: 1;

        .form-control:focus {
            outline: none;
            border-color: #FFD700;

        .modal-links {

            margin: 1rem 0;

            color: #8B4513;

            margin: 0 auto 1rem auto;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.3);

            width: 100%;

            font-weight: 700;

           /* Burbujas de cerveza */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }

         @keyframes ripple {
            0%, 100% { opacity: 0.8; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        @keyframes rise {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(var(--drift)) scale(0.8);
            }
        }

     <script>
// Agregar evento de clic al botón "Soy Cliente"
document.getElementById('opcion-cliente').addEventListener('click', function() {
    // Mostrar el modal de inicio de sesión de cliente
    document.getElementById('login-modal-cliente').style.display = 'flex';
});

// Agregar evento de clic al botón de cerrar del modal de cliente
document.getElementById('close-modal-cliente').addEventListener('click', function() {
    // Ocultar el modal de inicio de sesión de cliente
    document.getElementById('login-modal-cliente').style.display = 'none';
});

// Agregar evento de envío del formulario de cliente
document.getElementById('login-form-cliente').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevenir que se envíe el formulario de forma tradicional
    // Obtener los valores del formulario
    var emailCliente = document.getElementById('email-cliente').value;
    var passwordCliente = document.getElementById('password-cliente').value;
    
    // Verificar los datos (en este caso, solo un ejemplo)
    if (emailCliente === 'cliente@gmail.com' && passwordCliente === 'cliente123') {
        // Redirigir al cliente a una página específica
        window.location.href = 'http://localhost:8080/cliente-dashboard';
    } else {
        // Mostrar un mensaje de error
        document.getElementById('error-message-cliente').innerHTML = 'Datos incorrectos';
        document.getElementById('error-message-cliente').style.display = 'block';
    }
});

        // Agregar evento de clic al botón
document.getElementById('opcion-usuario').addEventListener('click', function() {
    // Mostrar el modal de inicio de sesión
    document.getElementById('login-modal').style.display = 'flex';
});

// Agregar evento de clic al botón de cerrar
document.getElementById('close-modal').addEventListener('click', function() {
    // Ocultar el modal de inicio de sesión
    document.getElementById('login-modal').style.display = 'none';
});

// Agregar evento de envío del formulario
document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevenir que se envíe el formulario de forma tradicional
    // Obtener los valores del formulario
    var lejago = document.getElementById('lejago').value;
    var password = document.getElementById('password').value;
    
    // Verificar los datos (en este caso, solo un ejemplo)
    if (lejago === '123456' && password === 'password123') {
        // Redirigir al usuario a una página específica
        window.location.href = 'http://localhost:8080/home';
    } else {
        // Mostrar un mensaje de error
        document.getElementById('error-message').innerHTML = 'Datos incorrectos';
        document.getElementById('error-message').style.display = 'block';
    }
});

        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('login-modal');
            const btnIniciarSesion = document.getElementById('btn-iniciar-sesion');
            const closeModal = document.getElementById('close-modal');
            const loginForm = document.getElementById('login-form');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            const btnLogin = document.getElementById('btn-login');
            
            // Verificar si el usuario está autenticado (URL con #)
            if (window.location.hash === '#') {
                // Usuario autenticado - cambiar el botón de "Iniciar sesión" a "Mi Perfil"
                btnIniciarSesion.textContent = 'Mi Perfil';
                btnIniciarSesion.classList.remove('active');
                btnIniciarSesion.style.background = 'linear-gradient(135deg, #DAA520 0%, #FFD700 100%)';
                btnIniciarSesion.style.color = '#8B4513';
                btnIniciarSesion.style.border = '2px solid #FFD700';
                
                // Cambiar el comportamiento del botón
                btnIniciarSesion.removeAttribute('href');
                btnIniciarSesion.onclick = function(e) {
                    e.preventDefault();
                    alert('¡Bienvenido! Estás autenticado como cliente.');
                };
                
                // Cambiar el contenido de bienvenida
                const heroTitle = document.getElementById('hero-title');
                const heroSubtitle = document.getElementById('hero-subtitle');
                
                if (heroTitle) {
                    heroTitle.textContent = '¡Bienvenido Cliente Autenticado!';
                    heroTitle.style.color = '#FFD700';
                    heroTitle.style.textShadow = '2px 2px 4px rgba(0, 0, 0, 0.8)';
                }
                
                if (heroSubtitle) {
                    heroSubtitle.textContent = 'Ahora puedes acceder a todas las funcionalidades del sistema';
                    heroSubtitle.style.color = '#DAA520';
                }
            }
            
            // Mostrar modal al hacer clic en "Iniciar sesión"
            btnIniciarSesion.addEventListener('click', function(e) {
                e.preventDefault();
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Prevenir scroll del body
            });
            
            // Cerrar modal
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            });
            
            // Cerrar modal al hacer clic fuera de él
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
            
            // Función para mostrar mensajes
            function mostrarMensaje(mensaje, tipo) {
                if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            // Manejo del formulario de login
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Validación básica
                if (!email || !password) {
                    mostrarMensaje('Por favor completa todos los campos', 'error');
                    return;
                }
                
                // Deshabilitar botón
                btnLogin.disabled = true;
                btnLogin.textContent = 'Iniciando...';
                
                try {
                    // Credenciales de prueba
                    if (email === 'dev@gmail.com' && password === '1234') {
                        // Login exitoso
                        mostrarMensaje('¡Inicio de sesión exitoso!', 'success');
                        
                        // Cerrar modal después de 2 segundos
                        setTimeout(() => {
                            modal.style.display = 'none';
                            document.body.style.overflow = 'auto';
                            
                            // Redirigir a la misma página con indicador de autenticado
                            window.location.href = 'http://localhost:8080/cliente-dashboard#';
                        }, 2000);
                    } else {
                        // Credenciales incorrectas
                        mostrarMensaje('Email o contraseña incorrectos', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Intenta nuevamente.', 'error');
                } finally {
                    // Rehabilitar botón
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Iniciar sesión';
                }
            });
            
            // Animación de entrada para los elementos
            const elements = document.querySelectorAll('.nav-item, .hero-content');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    element.style.transition = 'all 0.6s ease';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
