<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f1cf10cc 0%, #ddb70d 50%, #ecaf08 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .inicio-container {
            background: rgb(139, 63, 0);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem 2.5rem;
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #DAA520;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.3);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .logo-section h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .logo-section p {
            color: #ffffff;
            font-size: 1rem;
        }
        
        .opciones-container {
            display: flex;
            flex-direction: column; 
            gap: 1.5rem;
        }
        
        .opcion-card {
            border: 2px solid #ad6200;
            border-radius: 15px;    
            padding: 2rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background: #ad6200;
        }
        
        .opcion-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #DAA520;
        }
        
        .opcion-usuario:hover {
            background: linear-gradient(135deg, #8B451315 0%, #A0522D15 100%);
        }
        
        .opcion-cliente:hover {
            background: linear-gradient(135deg, #DAA52015 0%, #FFD70015 100%);
        }
        
        .opcion-icon {
            font-size: 3rem;
            min-width: 60px;
            text-align: center;
        }
        
        .opcion-usuario .opcion-icon {
            color: #ffaf02;
        }
        
        .opcion-cliente .opcion-icon {
            color: #ffaf02;
        }
        
        .opcion-content h3 {
            margin: 0 0 0.5rem 0;
            color: #fffdfb;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .opcion-content p {
            margin: 0;
            color: #fce3be;
            font-size: 0.95rem;
        }
        
        .arrow-icon {
            margin-left: auto;
            font-size: 1.5rem;
            color: #f8d616;
        }
        
        @media (max-width: 576px) {
            .inicio-container {
                padding: 2rem 1.5rem;
            }
            
            .logo-section h1 {
                font-size: 1.5rem;
            }
            
            .opcion-card {
                padding: 1.5rem;
                gap: 1rem;
            }
            
            .opcion-icon {
                font-size: 2.5rem;
                min-width: 50px;
            }
            
            .opcion-content h3 {
                font-size: 1.2rem;
            }
        }

           /* Burbujas de cerveza */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }

         @keyframes ripple {
            0%, 100% { opacity: 0.8; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        @keyframes rise {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(var(--drift)) scale(0.8);
            }
        }

     .bubble:nth-child(1) { width: 8px; height: 8px; left: 5%; animation-duration: 8s; animation-delay: 0s; --drift: 10px; }
        .bubble:nth-child(2) { width: 12px; height: 12px; left: 10%; animation-duration: 10s; animation-delay: 2s; --drift: -15px; }
        .bubble:nth-child(3) { width: 10px; height: 10px; left: 15%; animation-duration: 9s; animation-delay: 1s; --drift: 8px; }
        .bubble:nth-child(4) { width: 6px; height: 6px; left: 20%; animation-duration: 7s; animation-delay: 3s; --drift: -12px; }
        .bubble:nth-child(5) { width: 14px; height: 14px; left: 25%; animation-duration: 11s; animation-delay: 0.5s; --drift: 18px; }
        .bubble:nth-child(6) { width: 8px; height: 8px; left: 30%; animation-duration: 8.5s; animation-delay: 2.5s; --drift: -10px; }
        .bubble:nth-child(7) { width: 11px; height: 11px; left: 35%; animation-duration: 9.5s; animation-delay: 1.5s; --drift: 12px; }
        .bubble:nth-child(8) { width: 7px; height: 7px; left: 40%; animation-duration: 7.5s; animation-delay: 3.5s; --drift: -8px; }
        .bubble:nth-child(9) { width: 13px; height: 13px; left: 45%; animation-duration: 10.5s; animation-delay: 1s; --drift: 15px; }
        .bubble:nth-child(10) { width: 9px; height: 9px; left: 50%; animation-duration: 8s; animation-delay: 4s; --drift: -9px; }
        .bubble:nth-child(11) { width: 10px; height: 10px; left: 55%; animation-duration: 9s; animation-delay: 2s; --drift: 11px; }
        .bubble:nth-child(12) { width: 6px; height: 6px; left: 60%; animation-duration: 7s; animation-delay: 3s; --drift: -6px; }
        .bubble:nth-child(13) { width: 12px; height: 12px; left: 65%; animation-duration: 10s; animation-delay: 1.5s; --drift: 14px; }
        .bubble:nth-child(14) { width: 9px; height: 9px; left: 70%; animation-duration: 8.5s; animation-delay: 2.5s; --drift: -10px; }
        .bubble:nth-child(15) { width: 8px; height: 8px; left: 75%; animation-duration: 7.5s; animation-delay: 3.5s; --drift: 8px; }
        .bubble:nth-child(16) { width: 11px; height: 11px; left: 80%; animation-duration: 9s; animation-delay: 0.8s; --drift: -11px; }
        .bubble:nth-child(17) { width: 7px; height: 7px; left: 85%; animation-duration: 8s; animation-delay: 2.8s; --drift: 9px; }
        .bubble:nth-child(18) { width: 10px; height: 10px; left: 90%; animation-duration: 10s; animation-delay: 1.2s; --drift: -12px; }
        .bubble:nth-child(19) { width: 8px; height: 8px; left: 95%; animation-duration: 9s; animation-delay: 3.2s; --drift: 10px; }
        .bubble:nth-child(20) { width: 12px; height: 12px; left: 3%; animation-duration: 7.5s; animation-delay: 0.3s; --drift: -8px; }
        .bubble:nth-child(21) { width: 9px; height: 9px; left: 8%; animation-duration: 8.5s; animation-delay: 1.8s; --drift: 7px; }
        .bubble:nth-child(22) { width: 7px; height: 7px; left: 13%; animation-duration: 9.5s; animation-delay: 2.3s; --drift: -9px; }
        .bubble:nth-child(23) { width: 11px; height: 11px; left: 18%; animation-duration: 10.5s; animation-delay: 0.7s; --drift: 11px; }

        .bubble:nth-child(30) { width: 7px; height: 7px; left: 53%; animation-duration: 9.5s; animation-delay: 2.2s; --drift: -7px; }

    <div class="inicio-container">
        <!-- Logo y título -->
        <div class="logo-section">
            <div class="logo">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">
            </div>
            <h1>Sistema Sierra Maestra</h1>
            <p>Seleccione su tipo de acceso</p>
        </div>
        
        <!-- Opciones de acceso -->
        <div class="opciones-container">
            <!-- Opción Usuario/Administrador -->
            <a th:href="@{/home}" class="opcion-card opcion-usuario">
                <div class="opcion-icon">
                    <i class="bi bi-person-gear"></i>
                </div>
                <div class="opcion-content">
                    <h3>Soy Usuario</h3>
                    <p>Acceso al sistema de gestión administrativa</p>
                </div>
                <div class="arrow-icon">
                    <i class="bi bi-arrow-right-circle"></i>
                </div>
            </a>
            
            <!-- Opción Cliente -->
            <a th:href="@{/cliente-dashboard}" class="opcion-card opcion-cliente">
                <div class="opcion-icon">
                    <i class="bi bi-cart-check"></i>
                </div>
                <div class="opcion-content">
                    <h3>Soy Cliente</h3>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('login-modal');
            const btnIniciarSesion = document.getElementById('btn-iniciar-sesion');
            const closeModal = document.getElementById('close-modal');
            const loginForm = document.getElementById('login-form');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');
            const btnLogin = document.getElementById('btn-login');
            
            // Verificar si el usuario está autenticado (URL con #)
            if (window.location.hash === '#') {
                // Usuario autenticado - cambiar el botón de "Iniciar sesión" a "Mi Perfil"
                btnIniciarSesion.textContent = 'Mi Perfil';
                btnIniciarSesion.classList.remove('active');
                btnIniciarSesion.style.background = 'linear-gradient(135deg, #DAA520 0%, #FFD700 100%)';
                btnIniciarSesion.style.color = '#8B4513';
                btnIniciarSesion.style.border = '2px solid #FFD700';
                
                // Cambiar el comportamiento del botón
                btnIniciarSesion.removeAttribute('href');
                btnIniciarSesion.onclick = function(e) {
                    e.preventDefault();
                    alert('¡Bienvenido! Estás autenticado como cliente.');
                };
                
                // Cambiar el contenido de bienvenida
                const heroTitle = document.getElementById('hero-title');
                const heroSubtitle = document.getElementById('hero-subtitle');
                
                if (heroTitle) {
                    heroTitle.textContent = '¡Bienvenido Cliente Autenticado!';
                    heroTitle.style.color = '#FFD700';
                    heroTitle.style.textShadow = '2px 2px 4px rgba(0, 0, 0, 0.8)';
                }
                
                if (heroSubtitle) {
                    heroSubtitle.textContent = 'Ahora puedes acceder a todas las funcionalidades del sistema';
                    heroSubtitle.style.color = '#DAA520';
                }
            }
            
            // Mostrar modal al hacer clic en "Iniciar sesión"
            btnIniciarSesion.addEventListener('click', function(e) {
                e.preventDefault();
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Prevenir scroll del body
            });
            
            // Cerrar modal
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            });
            
            // Cerrar modal al hacer clic fuera de él
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });
            
            // Función para mostrar mensajes
            function mostrarMensaje(mensaje, tipo) {
                if (tipo === 'success') {
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                } else {
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = mensaje;
                    successMessage.style.display = 'none';
                }
            }
            
            // Manejo del formulario de login
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Validación básica
                if (!email || !password) {
                    mostrarMensaje('Por favor completa todos los campos', 'error');
                    return;
                }
                
                // Deshabilitar botón
                btnLogin.disabled = true;
                btnLogin.textContent = 'Iniciando...';
                
                try {
                    // Credenciales de prueba
                    if (email === 'dev@gmail.com' && password === '1234') {
                        // Login exitoso
                        mostrarMensaje('¡Inicio de sesión exitoso!', 'success');
                        
                        // Cerrar modal después de 2 segundos
                        setTimeout(() => {
                            modal.style.display = 'none';
                            document.body.style.overflow = 'auto';
                            
                            // Redirigir a la misma página con indicador de autenticado
                            window.location.href = 'http://localhost:8080/cliente-dashboard#';
                        }, 2000);
                    } else {
                        // Credenciales incorrectas
                        mostrarMensaje('Email o contraseña incorrectos', 'error');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    mostrarMensaje('Error de conexión. Intenta nuevamente.', 'error');
                } finally {
                    // Rehabilitar botón
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Iniciar sesión';
                }
            });
            
            // Animación de entrada para los elementos
            const elements = document.querySelectorAll('.nav-item, .hero-content');
            elements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    element.style.transition = 'all 0.6s ease';
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
