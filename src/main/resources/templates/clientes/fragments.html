  <div th:fragment="lista" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${#lists.isEmpty(items)}">No hay clientes.</div>
  <div th:each="c : ${items}" class="card mb-2 p-2 position-relative" th:attr="data-view-url=@{/clientes/view/{id}(id=${c.id})}, data-view-target='#cliente-form'">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong th:text="${c.id}">ID</strong>
          <div class="muted" th:text="${c.nombre}">Nombre</div>
        </div>
        <div>
          <button class="btn btn-sm btn-outline-secondary me-1" th:attr="hx-get=@{/clientes/{id}(id=${c.id})}" hx-target="#cliente-form" hx-swap="innerHTML"><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger" th:attr="hx-delete=@{/deleteCliente/{id}(id=${c.id})}" hx-confirm="Eliminar?" hx-swap="none" onclick="event.stopPropagation()" hx-on:afterRequest="htmx.ajax('GET','/clientes/list','#clientes-list')"><i class="bi bi-trash-fill"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div th:fragment="form">
    <form th:action="@{/clientes/save}" th:object="${cliente}" hx-post="/clientes/save" hx-target="#clientes-list" hx-swap="innerHTML">
      <input type="hidden" th:field="*{id}" />
      <div class="row">
        <div class="col mb-2">
          <label>Nombre</label>
          <input class="form-control" th:field="*{nombre}" required />
        </div>
        <div class="col mb-2">
          <label>Apellido</label>
          <input class="form-control" th:field="*{apellido}" required />
        </div>
      </div>
      <div class="mb-2">
        <label>Documento</label>
        <input class="form-control" th:field="*{documento}" required />
      </div>
      <div class="mb-2">
        <label>Mail</label>
        <input class="form-control" type="email" th:field="*{mail}" />
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <button type="button" class="btn btn-secondary" hx-get="/clientes/list" hx-target="#clientes-list" hx-swap="innerHTML">Cancelar</button>
      </div>
    </form>
  </div>

  <div th:fragment="view">
    <div class="card p-3">
      <h6>Detalle Cliente</h6>
      <div><strong>Id:</strong> <span th:text="${cliente.id}">-</span></div>
      <div><strong>Nombre:</strong> <span th:text="${cliente.nombre}">-</span></div>
      <div><strong>Apellido:</strong> <span th:text="${cliente.apellido}">-</span></div>
      <div><strong>Documento:</strong> <span th:text="${cliente.documento}">-</span></div>
      <div><strong>Mail:</strong> <span th:text="${cliente.mail}">-</span></div>
      <div class="d-flex justify-content-end mt-2">
        <button class="btn btn-sm btn-secondary" hx-get="/clientes/list" hx-target="#clientes-list" hx-swap="innerHTML">Cerrar</button>
      </div>
    </div>
  </div>
