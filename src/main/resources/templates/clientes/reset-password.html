<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
    <h2 class="text-center mb-4">Restablecer contraseña</h2>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Token inválido o expirado.</span>
        <div class="mt-3 text-center">
            <a th:href="@{/clientes/forgot-password}" class="btn btn-warning">Solicitar nuevo enlace</a>
        </div>
    </div>

    <!-- Mensaje de éxito -->
    <div th:if="${mensaje}" class="alert alert-success" role="alert">
        <span th:text="${mensaje}">Contraseña actualizada correctamente.</span>
        <div class="mt-3 text-center">
            <a th:href="@{/}" class="btn btn-primary">Volver al inicio</a>
        </div>
    </div>

    <!-- Formulario (solo si hay token y no hay error ni éxito) -->
    <form th:if="${token} and ${mensaje} == null and ${error} == null"
          th:action="@{/clientes/reset-password}" method="post">

        <input type="hidden" name="token" th:value="${token}" />

        <div class="mb-3">
            <label for="nuevaContrasenia" class="form-label">Nueva contraseña</label>
            <input type="password" id="nuevaContrasenia" name="nuevaContrasenia"
                   class="form-control" required />
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success">Confirmar</button>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
