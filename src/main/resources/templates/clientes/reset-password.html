<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Sistema Sierra Maestra</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #f1cf10cc 0%, #ddb70d 50%, #ecaf08 100%);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, rgb(99, 57, 18), rgb(2, 1, 0) 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-bottom: 3px solid #DAA520;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        
        .logo-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #DAA520;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.3);
        }
        
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .logo-text {
            color: #ffffffbe;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }
        
        .nav-item {
            color: #ceb7a5b2;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-item:hover {
            background-color: rgba(216, 190, 124, 0.3);
            color: #c46a0a;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            border: 2px solid #DAA520;
            color: #583207;
            font-weight: bold;
        }
        
        .nav-item.active:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(218, 165, 32, 0.4);
        }
        
        /* Main Content */
        .main-content {
            background: transparent;
            min-height: calc(100vh - 80px);
            padding-top: 90px;
            position: relative;
            overflow: hidden;
        }
        
        /* Burbujas de cerveza */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.3));
            border-radius: 50%;
            opacity: 0.6;
            animation: rise linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 1;
            pointer-events: none;
        }
        
        .subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 400;
            margin-top: 1.4rem;
            opacity: 2;
            background: linear-gradient(135deg, rgb(21, 156, 9),rgb(255, 238, 0), rgba(255, 8, 8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: ripple 3s ease-in-out infinite, waveGlow 4s ease-in-out infinite alternate;
        }
        
        @keyframes waveGlow {
            0% { 
                text-shadow: 0 0 30px rgba(64, 212, 6, 0.8),
                           0 0 60px rgba(36, 238, 18, 0.6);
            }
            50% { 
                text-shadow: 0 0 40px rgb(213, 250, 2),
                             0 0 200px rgb(240, 236, 6),
                           0 0 200px rgba(255, 238, 2, 0.993);
            }
            100% { 
                text-shadow: 0 0 40px rgb(255, 30, 0),
                           0 0 80px rgba(255, 2, 2, 0.925),
                           0 0 200px rgba(250, 0, 0, 0.932);
            }
        }

        @keyframes ripple {
            0%, 100% { opacity: 0.8; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
        
        @keyframes rise {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0) scale(1);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(var(--drift)) scale(0.8);
            }
        }
        
        .bubble:nth-child(1) { width: 8px; height: 8px; left: 5%; animation-duration: 8s; animation-delay: 0s; --drift: 10px; }
        .bubble:nth-child(2) { width: 12px; height: 12px; left: 10%; animation-duration: 10s; animation-delay: 2s; --drift: -15px; }
        .bubble:nth-child(3) { width: 10px; height: 10px; left: 15%; animation-duration: 9s; animation-delay: 1s; --drift: 8px; }
        .bubble:nth-child(4) { width: 6px; height: 6px; left: 20%; animation-duration: 7s; animation-delay: 3s; --drift: -12px; }
        .bubble:nth-child(5) { width: 14px; height: 14px; left: 25%; animation-duration: 11s; animation-delay: 0.5s; --drift: 18px; }
        .bubble:nth-child(6) { width: 8px; height: 8px; left: 30%; animation-duration: 8.5s; animation-delay: 2.5s; --drift: -10px; }
        .bubble:nth-child(7) { width: 11px; height: 11px; left: 35%; animation-duration: 9.5s; animation-delay: 1.5s; --drift: 12px; }
        .bubble:nth-child(8) { width: 7px; height: 7px; left: 40%; animation-duration: 7.5s; animation-delay: 3.5s; --drift: -8px; }
        .bubble:nth-child(9) { width: 13px; height: 13px; left: 45%; animation-duration: 10.5s; animation-delay: 1s; --drift: 15px; }
        .bubble:nth-child(10) { width: 9px; height: 9px; left: 50%; animation-duration: 8s; animation-delay: 4s; --drift: -9px; }
        
        .form-container {
            max-width: 600px;
            margin: 0 auto;     
            background: linear-gradient(135deg, #dfba15f8 0%, #eca814 100%); 
            border: 2px solid #DAA520; 
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: #333; 
            padding: 2rem 3rem;
        }
        
        .form-container h1 {
            color: #47138b;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .form-group {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            color: #8B4513;
            font-weight: 600;
            min-width: 180px;
            text-align: right;
        }
        
        .form-control {
            background-color: white;
            border: 2px solid #DAA520;
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 1rem;
            color: #333;
            flex-grow: 1;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(218, 165, 32, 0.3);
        }
        
        .password-input-container {
            position: relative;
            flex-grow: 1;
        }
        
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8B4513;
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .toggle-password:hover {
            color: #DAA520;
        }
        
        /* Success Message */
        .success-message {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            margin: 2rem 0;
            box-shadow: 0 10px 30px rgba(218, 165, 32, 0.5);
            border: 3px solid #FFD700;
        }
        
        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            margin: 1rem 0;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #DAA520 0%, #FFD700 100%);
            color: #8B4513;
            border: 2px solid #DAA520;
            padding: 1rem 3rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 2rem auto;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #FFD700 0%, #DAA520 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4);
            color: #8B4513;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            color: white;
            border: 2px solid #6c757d;
            padding: 1rem 3rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 1rem auto;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(135deg, #495057 0%, #6c757d 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
            color: white;
        }
        
        /* Validation Styles */
        .form-control.is-valid {
            border-color: #28a745;
        }
        
        .form-control.is-invalid {
            border-color: #dc3545;
        }
        
        .invalid-feedback {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            text-align: center;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .form-group {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            
            .form-label {
                text-align: left;
                min-width: auto;
            }
            
            .header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .form-container {
                padding: 1.5rem;
            }
            
            .button-container {
                flex-direction: column;
            }
            
            .btn-primary, .btn-secondary {
                width: 100%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a th:href="@{/inicio}" class="logo" style="text-decoration: none; cursor: pointer;">
            <div class="logo-circle">
                <img src="/images/logo.jpg" alt="Sierra Maestra Logo">   
            </div>
            <div class="logo-text">Sierra Maestra</div>
        </a>
        <p class="subtitle">Para todos la luz, para todos todo</p>
        
        <nav class="nav-menu">
            <a href="#cervezas" class="nav-item">Nuestras Cervezas</a>
            <a href="#promos" class="nav-item">Promos</a>
            <a href="#quienes-somos" class="nav-item">¿Quiénes somos?</a>
            <a th:href="@{/inicio}" class="nav-item active" id="btn-iniciar-sesion">Iniciar sesión</a>
        </nav>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Burbujas de cerveza -->
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        
        <div class="form-container">
            <h1>Restablecer Contraseña</h1>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="error-message">
                <span th:text="${error}">Token inválido o expirado.</span>
                <div class="button-container mt-3">
                    <a th:href="@{/clientes/forgot-password}" class="btn btn-secondary">Solicitar nuevo enlace</a>
                </div>
            </div>

            <!-- Mensaje de éxito -->
            <div th:if="${mensaje}" class="success-message">
                <span th:text="${mensaje}">Contraseña actualizada correctamente.</span>
                <div class="button-container mt-3">
                    <a th:href="@{/}" class="btn btn-primary">Volver al inicio</a>
                </div>
            </div>

            <!-- Formulario (solo si hay token y no hay error ni éxito) -->
            <form th:if="${token} and ${mensaje} == null and ${error} == null"
                  th:action="@{/clientes/reset-password}" method="post" id="reset-password-form" novalidate>

                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-group">
                    <label for="nuevaContrasenia" class="form-label">Nueva contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="nuevaContrasenia" name="nuevaContrasenia"
                               class="form-control" required minlength="6"
                               placeholder="Mínimo 6 caracteres" />
                        <button type="button" class="toggle-password" data-target="nuevaContrasenia">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmarContrasenia" class="form-label">Confirmar contraseña</label>
                    <div class="password-input-container">
                        <input type="password" id="confirmarContrasenia" name="confirmarContrasenia"
                               class="form-control" required minlength="6"
                               placeholder="Repita la contraseña" />
                        <button type="button" class="toggle-password" data-target="confirmarContrasenia">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="invalid-feedback" id="password-error"></div>

                <div class="button-container">
                    <button type="submit" class="btn btn-primary">Confirmar</button>
                    <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('reset-password-form');
            const passwordError = document.getElementById('password-error');
            
            if (form) {
                // Función para mostrar/ocultar contraseña
                document.querySelectorAll('.toggle-password').forEach(button => {
                    button.addEventListener('click', function() {
                        const targetId = this.getAttribute('data-target');
                        const passwordInput = document.getElementById(targetId);
                        const icon = this.querySelector('i');
                        
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            icon.classList.remove('bi-eye');
                            icon.classList.add('bi-eye-slash');
                        } else {
                            passwordInput.type = 'password';
                            icon.classList.remove('bi-eye-slash');
                            icon.classList.add('bi-eye');
                        }
                    });
                });

                // Validación de contraseñas
                function validatePasswords() {
                    const password = document.getElementById('nuevaContrasenia').value;
                    const confirmPassword = document.getElementById('confirmarContrasenia').value;
                    
                    // Limpiar mensajes de error previos
                    passwordError.textContent = '';
                    document.getElementById('nuevaContrasenia').classList.remove('is-invalid');
                    document.getElementById('confirmarContrasenia').classList.remove('is-invalid');
                    
                    let isValid = true;
                    
                    // Validar longitud mínima
                    if (password.length < 6) {
                        passwordError.textContent = 'La contraseña debe tener al menos 6 caracteres';
                        document.getElementById('nuevaContrasenia').classList.add('is-invalid');
                        isValid = false;
                    }
                    
                    // Validar que las contraseñas coincidan
                    if (password !== confirmPassword) {
                        passwordError.textContent = 'Las contraseñas no coinciden';
                        document.getElementById('nuevaContrasenia').classList.add('is-invalid');
                        document.getElementById('confirmarContrasenia').classList.add('is-invalid');
                        isValid = false;
                    }
                    
                    return isValid;
                }

                // Validación en tiempo real
                document.getElementById('nuevaContrasenia').addEventListener('input', validatePasswords);
                document.getElementById('confirmarContrasenia').addEventListener('input', validatePasswords);

                // Validación al enviar el formulario
                form.addEventListener('submit', function(e) {
                    if (!validatePasswords()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });
            }
        });
    </script>
</body>
</html>
