<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Asociados</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/asociados/list" hx-target="#asociados-list" hx-swap="innerHTML">Actualizar</button>
          <button class="btn btn-success" hx-get="/asociados/form" hx-target="#asociado-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

    <div id="asociados-list"></div>
    <div id="asociado-form" class="mt-3"></div>
    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/asociados/list','#asociados-list'); });</script>
  </section>
</html>
