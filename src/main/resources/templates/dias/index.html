<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::content})">
  <section th:fragment="content">
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="m-0">Días</h2>
        <div>
          <button class="btn btn-outline-primary me-2" hx-get="/dias/list" hx-target="#dias-list" hx-swap="innerHTML">Cargar</button>
          <button class="btn btn-success" hx-get="/dias/form" hx-target="#dia-form" hx-swap="innerHTML">Nuevo</button>
        </div>
      </div>
    </div>

    <div id="#dias-list"></div>
    <div id="#dia-form" class="mt-3"></div>
    <script>document.addEventListener('DOMContentLoaded', ()=>{ htmx.ajax('GET','/dias/list','#dias-list'); });</script>
  </section>
</html>
